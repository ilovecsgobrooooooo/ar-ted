<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Job Simulator VR</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
    position: fixed;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #three-canvas { z-index: 1; }
  #hand-canvas  { z-index: 2; pointer-events: none; }
  #touch-layer  { position: fixed; inset: 0; z-index: 5; touch-action: none; }

  /* ПРЕЛОАДЕР */
  #preloader {
    position: fixed; inset: 0;
    z-index: 500;
    background: radial-gradient(circle at 50% 40%, #1a1a4e 0%, #0a0a18 60%, #000 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    transition: opacity 0.6s ease;
    padding: 20px;
  }
  #preloader.hidden { opacity: 0; pointer-events: none; }
  #preloader .logo {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 3px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #ff3366, #aa44ff, #33aaff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
  }
  #preloader .subtitle {
    font-size: 12px;
    color: #88aaff;
    letter-spacing: 4px;
    margin-bottom: 40px;
    font-weight: 600;
    text-align: center;
  }
  #preloader .bar-track {
    width: min(320px, 78vw);
    height: 8px;
    background: rgba(255,255,255,0.12);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 14px;
    box-shadow: 0 0 20px rgba(170,68,255,0.3) inset;
  }
  #preloader .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4488ff, #aa44ff, #ff44aa);
    border-radius: 6px;
    transition: width 0.25s ease;
    box-shadow: 0 0 15px rgba(170,68,255,0.8);
  }
  #preloader .bar-label {
    width: min(320px, 78vw);
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  #preloader .bar-label .txt { color: #88aaff; }
  #preloader .bar-label .pct { color: #44ffaa; font-variant-numeric: tabular-nums; }
  #preloader .hint {
    margin-top: 30px;
    font-size: 12px;
    color: #556;
    text-align: center;
    max-width: 300px;
    line-height: 1.6;
  }
  #preloader .spinner {
    margin-top: 40px;
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: #aa44ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #preloader.done .spinner { display: none; }
  #preloader .ready-btn {
    display: none;
    margin-top: 30px;
    padding: 18px 40px;
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, #ff3366, #aa44ff);
    border: none;
    border-radius: 60px;
    box-shadow: 0 10px 40px rgba(170,68,255,0.6);
    cursor: pointer;
    letter-spacing: 1px;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
    animation: popIn 0.4s ease;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }
  #preloader.done .ready-btn { display: block; }
  #preloader.done .hint { display: none; }

  /* КНОПКА FULLSCREEN */
  #fs-btn {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    right: max(10px, env(safe-area-inset-right));
    z-index: 150;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: manipulation;
  }
  #fs-btn:active { transform: scale(0.9); }

  /* КНОПКА СТАРТА (одноразовая, исчезает) */
  #start-btn {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 200;
    padding: 22px 46px;
    font-size: 20px; font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, #ff3366, #aa44ff);
    border: none; border-radius: 60px;
    box-shadow: 0 10px 40px rgba(170,68,255,0.6);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    letter-spacing: 1px;
    font-family: inherit;
    display: none;
  }
  #start-btn:active { transform: translate(-50%, -50%) scale(0.95); }

  /* ПРОГРЕСС БАР MEDIAPIPE */
  #mp-bar {
    position: fixed;
    top: max(52px, calc(env(safe-area-inset-top) + 40px));
    left: 50%; transform: translateX(-50%);
    z-index: 100;
    width: min(320px, 70vw);
    background: rgba(0,0,0,0.6);
    border-radius: 20px;
    padding: 8px 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    transition: opacity 0.4s, transform 0.4s;
  }
  #mp-bar.hidden {
    opacity: 0;
    transform: translate(-50%, -20px);
    pointer-events: none;
  }
  #mp-label {
    color: #fff; font-size: 11px; font-weight: 600;
    margin-bottom: 5px;
    display: flex; justify-content: space-between; align-items: center;
  }
  #mp-label .status-txt { color: #88aaff; }
  #mp-label .pct { color: #44ffaa; font-variant-numeric: tabular-nums; }
  #mp-track {
    width: 100%; height: 5px;
    background: rgba(255,255,255,0.15);
    border-radius: 4px; overflow: hidden;
  }
  #mp-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4488ff, #aa44ff, #ff44aa);
    border-radius: 4px;
    transition: width 0.2s;
  }

  #status {
    position: fixed;
    bottom: max(12px, env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 12px;
    background: rgba(0,0,0,0.6);
    padding: 6px 14px; border-radius: 20px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 100;
    max-width: 90vw; text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #toast {
    position: fixed;
    bottom: max(60px, calc(env(safe-area-inset-bottom) + 50px));
    left: 50%; transform: translateX(-50%) translateY(20px);
    z-index: 300;
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 12px 20px;
    border-radius: 16px;
    font-size: 13px;
    max-width: 85vw;
    text-align: center;
    line-height: 1.4;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div id="preloader">
  <div class="logo">JOB SIMULATOR</div>
  <div class="subtitle">VR EXPERIENCE</div>

  <div class="bar-label">
    <span class="txt" id="pre-status">Загрузка...</span>
    <span class="pct" id="pre-pct">0%</span>
  </div>
  <div class="bar-track">
    <div class="bar-fill" id="pre-fill"></div>
  </div>

  <div class="spinner" id="pre-spinner"></div>
  <button class="ready-btn" id="pre-ready">▶ ВОЙТИ В VR</button>
  <div class="hint" id="pre-hint">
    Первая загрузка может занять 5–15 секунд<br>
    (скачивается модель распознавания рук)
  </div>
</div>

<canvas id="three-canvas"></canvas>
<canvas id="hand-canvas"></canvas>
<div id="touch-layer"></div>

<button id="fs-btn" title="На весь экран">⛶</button>
<div id="toast"></div>
<div id="mp-bar" class="hidden">
  <div id="mp-label">
    <span class="status-txt" id="mp-status">Загрузка рук...</span>
    <span class="pct" id="mp-pct">0%</span>
  </div>
  <div id="mp-track"><div id="mp-fill"></div></div>
</div>
<div id="status">Нажми «Старт» чтобы войти</div>
<button id="start-btn">▶ ВОЙТИ В VR</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function() {
  'use strict';

  // ============ DOM ============
  var preloader = document.getElementById('preloader');
  var preStatus = document.getElementById('pre-status');
  var prePct    = document.getElementById('pre-pct');
  var preFill   = document.getElementById('pre-fill');
  var preReady  = document.getElementById('pre-ready');
  var preSpinner= document.getElementById('pre-spinner');

  var canvas3d   = document.getElementById('three-canvas');
  var canvasHand = document.getElementById('hand-canvas');
  var handCtx    = canvasHand.getContext('2d');
  var touchLayer = document.getElementById('touch-layer');
  var startBtn   = document.getElementById('start-btn');
  var fsBtn      = document.getElementById('fs-btn');
  var statusEl   = document.getElementById('status');
  var mpBar      = document.getElementById('mp-bar');
  var mpFill     = document.getElementById('mp-fill');
  var mpPct      = document.getElementById('mp-pct');
  var mpStatus   = document.getElementById('mp-status');
  var toastEl    = document.getElementById('toast');

  if (typeof THREE === 'undefined') {
    preStatus.textContent = '❌ Three.js не загрузился';
    return;
  }

  // Скрываем кнопку старта по умолчанию
  startBtn.style.display = 'none';

  // ============ ПРЕЛОАДЕР ============
  var preProgress = 0;
  var preDone = false;

  function setPreProgress(value, text) {
    preProgress = Math.max(preProgress, Math.min(1, value));
    var pct = Math.round(preProgress * 100);
    preFill.style.width = pct + '%';
    prePct.textContent = pct + '%';
    if (text) preStatus.textContent = text;
  }

  function finishPreload() {
    if (preDone) return;
    preDone = true;
    setPreProgress(1, 'Готово!');
    preloader.classList.add('done');
    preSpinner.style.display = 'none';
  }

  setPreProgress(0.05, 'Инициализация...');

  var libCheck = setInterval(function() {
    if (typeof THREE !== 'undefined') setPreProgress(0.15, 'Three.js загружен');
  }, 200);

  var handsCheck = setInterval(function() {
    if (typeof Hands !== 'undefined') setPreProgress(0.25, 'MediaPipe готов');
  }, 200);

  // Прокачка модели
  (function preloadModel() {
    var urls = [
      { url: 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands_solution_packed_assets_loader.js', size: 50000 },
      { url: 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands_solution_simd_wasm_bin.wasm', size: 5000000 },
      { url: 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.binarypb', size: 500000 }
    ];
    var loaded = [0, 0, 0];
    var sizes = [50000, 5000000, 500000];
    var completed = 0;

    function updateProgress() {
      var total = 0, got = 0;
      for (var i = 0; i < 3; i++) { total += sizes[i]; got += Math.min(loaded[i], sizes[i]); }
      var overall = 0.25 + 0.6 * (got / total);
      setPreProgress(overall, 'Загрузка модели рук...');
    }

    urls.forEach(function(item, idx) {
      fetch(item.url).then(function(r) {
        var s = parseInt(r.headers.get('content-length')) || sizes[idx];
        sizes[idx] = s;
        var reader = r.body.getReader();
        function read() {
          return reader.read().then(function(res) {
            if (res.done) {
              completed++;
              if (completed === 3) {
                setPreProgress(0.92, 'Инициализация...');
                setTimeout(finishPreload, 400);
              }
              return;
            }
            loaded[idx] += res.value.length;
            updateProgress();
            return read();
          });
        }
        return read();
      }).catch(function() {
        completed++;
        if (completed === 3) {
          setPreProgress(0.92, 'Инициализация...');
          setTimeout(finishPreload, 400);
        }
      });
    });
  })();

  // Панорама
  (function preloadPano() {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = img.onerror = function() { setPreProgress(0.88, 'Панорама готова'); };
    img.src = 'https://threejs.org/examples/textures/2294472375_24a3b8ef46_o.jpg';
  })();

  setTimeout(function() {
    if (!preDone) { setPreProgress(0.95, 'Почти готово...'); finishPreload(); }
  }, 25000);

  preReady.addEventListener('click', function() {
    preloader.classList.add('hidden');
    setTimeout(function() { preloader.style.display = 'none'; }, 700);
    startBtn.style.display = 'block';
  });

  // ============ ТОСТ ============
  var toastTimer = null;
  function showToast(text, duration) {
    duration = duration || 3000;
    toastEl.textContent = text;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toastEl.classList.remove('show'); }, duration);
  }

  // ============ THREE.JS ============
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 1000);
  camera.position.set(0, 1.55, 0);
  camera.rotation.order = 'YXZ';

  var renderer = new THREE.WebGLRenderer({
    canvas: canvas3d, antialias: true, powerPreference: 'high-performance'
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  var raycaster = new THREE.Raycaster();
  var pointerNDC = new THREE.Vector2(0, 0);

  // ============ ФОН ============
  var panoGeo = new THREE.SphereGeometry(500, 60, 40);
  panoGeo.scale(-1, 1, 1);
  var panoMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  var pano = new THREE.Mesh(panoGeo, panoMat);
  scene.add(pano);

  var gradCanvas = document.createElement('canvas');
  gradCanvas.width = 1024; gradCanvas.height = 512;
  var gctx = gradCanvas.getContext('2d');
  var grad = gctx.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0.0, '#1a1a4e');
  grad.addColorStop(0.4, '#6a3a8a');
  grad.addColorStop(0.6, '#ff6a5a');
  grad.addColorStop(0.8, '#ffae5a');
  grad.addColorStop(1.0, '#3a2050');
  gctx.fillStyle = grad;
  gctx.fillRect(0, 0, 1024, 512);
  for (var i = 0; i < 250; i++) {
    gctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.7) + ')';
    gctx.fillRect(Math.random() * 1024, Math.random() * 220, 2, 2);
  }
  var sunGrad = gctx.createRadialGradient(512, 380, 0, 512, 380, 150);
  sunGrad.addColorStop(0, 'rgba(255,240,180,1)');
  sunGrad.addColorStop(0.4, 'rgba(255,180,100,0.6)');
  sunGrad.addColorStop(1, 'rgba(255,120,80,0)');
  gctx.fillStyle = sunGrad;
  gctx.fillRect(300, 250, 424, 260);
  var gradientTex = new THREE.CanvasTexture(gradCanvas);
  gradientTex.mapping = THREE.EquirectangularReflectionMapping;
  panoMat.map = gradientTex;
  panoMat.needsUpdate = true;

  var texLoader = new THREE.TextureLoader();
  texLoader.crossOrigin = 'anonymous';
  texLoader.load(
    'https://threejs.org/examples/textures/2294472375_24a3b8ef46_o.jpg',
    function(tex) {
      tex.mapping = THREE.EquirectangularReflectionMapping;
      panoMat.map = tex;
      panoMat.needsUpdate = true;
    },
    undefined,
    function() {}
  );

  // ============ СВЕТ ============
  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  var dl = new THREE.DirectionalLight(0xffffff, 1.0);
  dl.position.set(2, 5, 3);
  scene.add(dl);
  var pl1 = new THREE.PointLight(0xffaa66, 1.2, 25); pl1.position.set(0, 4, -3); scene.add(pl1);
  var pl2 = new THREE.PointLight(0x88aaff, 0.8, 25); pl2.position.set(-3, 3, 2); scene.add(pl2);

  // ============ ГРУППЫ ============
  var menuScene = new THREE.Group();
  var gameScene = new THREE.Group();
  gameScene.visible = false;
  scene.add(menuScene);
  scene.add(gameScene);

  // ================================================================
  // МЕНЮ
  // ================================================================
  var menuRoot = new THREE.Group();
  menuRoot.position.set(0, 1.5, -2.5);
  menuScene.add(menuRoot);

  menuRoot.add(new THREE.Mesh(
    new THREE.PlaneGeometry(2.4, 1.6),
    new THREE.MeshBasicMaterial({ color: 0x0a0a14, transparent: true, opacity: 0.92, side: THREE.DoubleSide })
  ));

  var border = new THREE.Mesh(
    new THREE.PlaneGeometry(2.44, 1.64),
    new THREE.MeshBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.7, side: THREE.DoubleSide })
  );
  border.position.z = -0.001;
  menuRoot.add(border);

  var titleCanvas = document.createElement('canvas');
  titleCanvas.width = 1024; titleCanvas.height = 256;
  var tctx = titleCanvas.getContext('2d');
  tctx.fillStyle = '#ffffff';
  tctx.font = 'bold 90px -apple-system, sans-serif';
  tctx.textAlign = 'center'; tctx.textBaseline = 'middle';
  tctx.fillText('JOB SIMULATOR', 512, 90);
  tctx.font = '44px -apple-system, sans-serif';
  tctx.fillStyle = '#88aaff';
  tctx.fillText('VR EXPERIENCE', 512, 180);
  var titleMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(2.0, 0.5),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(titleCanvas), transparent: true })
  );
  titleMesh.position.set(0, 0.5, 0.01);
  menuRoot.add(titleMesh);

  var hintCanvas = document.createElement('canvas');
  hintCanvas.width = 1024; hintCanvas.height = 128;
  var hctx = hintCanvas.getContext('2d');
  hctx.fillStyle = '#88aaff';
  hctx.font = '38px -apple-system, sans-serif';
  hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
  hctx.fillText('тапни по кнопке или наведи руку', 512, 64);
  var hintMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(1.8, 0.22),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(hintCanvas), transparent: true })
  );
  hintMesh.position.set(0, 0.05, 0.01);
  menuRoot.add(hintMesh);

  // Кнопка ИГРАТЬ
  var playBtnGroup = new THREE.Group();
  playBtnGroup.position.set(0, -0.35, 0.02);
  menuRoot.add(playBtnGroup);

  var playBtnMat = new THREE.MeshBasicMaterial({
    color: 0x44ff88, transparent: true, opacity: 0.9, side: THREE.DoubleSide
  });
  var playBtn = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.55), playBtnMat);
  playBtnGroup.add(playBtn);

  var playLabelCanvas = document.createElement('canvas');
  playLabelCanvas.width = 1024; playLabelCanvas.height = 256;
  var plctx = playLabelCanvas.getContext('2d');
  plctx.fillStyle = '#001a0a';
  plctx.font = 'bold 120px -apple-system, sans-serif';
  plctx.textAlign = 'center'; plctx.textBaseline = 'middle';
  plctx.fillText('▶  ИГРАТЬ', 512, 128);
  var playLabel = new THREE.Mesh(
    new THREE.PlaneGeometry(1.6, 0.55),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(playLabelCanvas), transparent: true })
  );
  playLabel.position.z = 0.005;
  playBtnGroup.add(playLabel);
  playBtn.userData.isButton = true;
  playBtn.userData.action = 'play';

  // Кнопка МЕНЮ
  var backBtnGroup = new THREE.Group();
  backBtnGroup.position.set(0, 2.9, -3.0);
  gameScene.add(backBtnGroup);

  var backBtnMat = new THREE.MeshBasicMaterial({
    color: 0x662288, transparent: true, opacity: 0.9, side: THREE.DoubleSide
  });
  var backBtn = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.35), backBtnMat);
  backBtnGroup.add(backBtn);

  var backLabelCanvas = document.createElement('canvas');
  backLabelCanvas.width = 512; backLabelCanvas.height = 128;
  var blctx = backLabelCanvas.getContext('2d');
  blctx.fillStyle = '#ffffff';
  blctx.font = 'bold 70px -apple-system, sans-serif';
  blctx.textAlign = 'center'; blctx.textBaseline = 'middle';
  blctx.fillText('◀ МЕНЮ', 256, 64);
  var backLabel = new THREE.Mesh(
    new THREE.PlaneGeometry(1.0, 0.35),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(backLabelCanvas), transparent: true })
  );
  backLabel.position.z = 0.005;
  backBtnGroup.add(backLabel);
  backBtn.userData.isButton = true;
  backBtn.userData.action = 'menu';

  // ================================================================
  // ИГРОВАЯ СЦЕНА
  // ================================================================
  var floor = new THREE.Mesh(
    new THREE.PlaneGeometry(20, 20),
    new THREE.MeshStandardMaterial({ color: 0x4a4030, roughness: 0.9 })
  );
  floor.rotation.x = -Math.PI / 2;
  gameScene.add(floor);

  var wallMat = new THREE.MeshStandardMaterial({ color: 0x6a5a4a, roughness: 1, side: THREE.DoubleSide });
  var backWall = new THREE.Mesh(new THREE.PlaneGeometry(20, 6), wallMat);
  backWall.position.set(0, 3, -8);
  gameScene.add(backWall);
  var leftWall = new THREE.Mesh(new THREE.PlaneGeometry(16, 6), wallMat);
  leftWall.position.set(-8, 3, 0);

    if (e.touches.length === 0) return;
    var t = e.touches[0];
    touchStartX = t.clientX;

    if (e.touches.length === 0) return;
    var t = e.touches[0];
    var dx = t.clientX - lastTouchX;
    var dy = t.clientY - lastTouchY;
    lastTouchX = t.clientX;
    lastTouchY = t.clientY;
    var totalDx = t.clientX - touchStartX;
    var totalDy = t.clientY - touchStartY;
    if (Math.abs(totalDx) > 8 || Math.abs(totalDy) > 8) touchMoved = true;
    if (touchMoved) {
      targetYaw   -= dx * SWIPE_SENS;
      targetPitch -= dy * SWIPE_SENS;
      if (targetPitch >  Math.PI / 3) targetPitch =  Math.PI / 3;
      if (targetPitch < -Math.PI / 3) targetPitch = -Math.PI / 3;
    }
    e.preventDefault();
  }, { passive: false });

    var t = e.changedTouches[0];
    var duration = performance.now() - touchStartTime;
    var totalDx = t.clientX - touchStartX;
    var totalDy = t.clientY - touchStartY;
    var dist = Math.sqrt(totalDx * totalDx + totalDy * totalDy);
    if (!touchMoved && dist < 15 && duration < 500) {
      handleTap(t.clientX, t.clientY);

  function initHands() {
    if (handsInstance) return;
    if (typeof Hands === 'undefined') {
      mpStatus.textContent = '⚠️ MediaPipe не загрузился';
      return;
    }
    try {
      handsInstance = new Hands({
        locateFile: function(f) {
          return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + f;
        }
      });
      handsInstance.setOptions({
        maxNumHands: 2,
        modelComplexity: 0,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5,
        selfieMode: false    // ← ЗАДНЯЯ КАМЕРА — без зеркалирования
      });
      handsInstance.onResults(function(results) {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length) {
          handData = results.multiHandLandmarks.map(function(lm, i) {
            // Центр ладони
            var ids = [0, 5, 9, 13, 17];
            var x = 0, y = 0;
            for (var k = 0; k < ids.length; k++) { x += lm[ids[k]].x; y += lm[ids[k]].y; }
            x /= ids.length; y /= ids.length;

            // Определяем "сжатие" — насколько близко кончики пальцев к ладони
            // Это будет триггер для стельки-контроллера
            var tips = [4, 8, 12, 16, 20];
            var tipDist = 0;
            for (var t = 0; t < tips.length; t++) {
              var tip = lm[tips[t]];
              var dx = tip.x - x;
              var dy = tip.y - y;
              tipDist += Math.sqrt(dx * dx + dy * dy);
            }
            tipDist /= tips.length;

            // Если средний радиус пальцев от центра ладони < 0.15 — рука сжата
            var isSqueezed = tipDist < 0.13;

            // handedness: какая рука (Left/Right от MediaPipe, но зеркалится через selfieMode)
            var handedness = results.multiHandedness && results.multiHandedness[i] ?
                             results.multiHandedness[i].label : 'Right';

            return {
              x: x, y: y,
              landmarks: lm,
              isSqueezed: isSqueezed,
              handedness: handedness,
              tipDist: tipDist
            };
          });
        } else {
          handData = [];
        }

  function trackModelDownload() {
    var urls = [
      'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands_solution_packed_assets_loader.js',
      'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands_solution_simd_wasm_bin.wasm',
      'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.binarypb'
    ];
    var loadedPerFile = [0, 0, 0];
    var sizePerFile = [50000, 5000000, 500000];
    function updateBar() {
      var total = 0, loaded = 0;
      for (var i = 0; i < urls.length; i++) {
        total += sizePerFile[i];
        loaded += Math.min(loadedPerFile[i], sizePerFile[i]);
      }
      var pct = Math.min(99, Math.round((loaded / total) * 100));
      mpFill.style.width = pct + '%';
      mpPct.textContent = pct + '%';
    }
    urls.forEach(function(url, idx) {
      fetch(url).then(function(response) {
        var size = parseInt(response.headers.get('content-length')) || sizePerFile[idx];
        sizePerFile[idx] = size;
        var reader = response.body.getReader();
        function read() {
          return reader.read().then(function(result) {
            if (result.done) return;
            loadedPerFile[idx] += result.value.length;
            updateBar();
            return read();
          });
        }
        return read();
      }).catch(function() {});
    });
  }

  // ============ РУКИ ============
  var CONNECTIONS = [
    [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],[0,17],[0,5]
  ];
  var HAND_COLORS = ['#00ffff', '#ff44aa'];

  function drawHands() {
    handCtx.clearRect(0, 0, canvasHand.width, canvasHand.height);
    if (!handData.length) return;
    var W = canvasHand.width, H = canvasHand.height;

    for (var hi = 0; hi < handData.length; hi++) {
      var data = handData[hi];
      var lm = data.landmarks;
      var color = HAND_COLORS[hi % HAND_COLORS.length];

      // НЕ зеркалим — задняя камера
      function px(l) { return l.x * W; }
      function py(l) { return l.y * H; }

      // === СКЕЛЕТ РУКИ ===
      handCtx.strokeStyle = color;
      handCtx.lineWidth = 4;
      handCtx.lineCap = 'round';
      handCtx.lineJoin = 'round';
      handCtx.shadowColor = color;
      handCtx.shadowBlur = 12;

      for (var ci = 0; ci < CONNECTIONS.length; ci++) {
        var a = lm[CONNECTIONS[ci][0]];
        var b = lm[CONNECTIONS[ci][1]];
        handCtx.beginPath();
        handCtx.moveTo(px(a), py(a));
        handCtx.lineTo(px(b), py(b));
        handCtx.stroke();
      }

      handCtx.shadowBlur = 8;
      handCtx.fillStyle = color;
      for (var ji = 0; ji < lm.length; ji++) {
        var j = lm[ji];
        handCtx.beginPath();
        handCtx.arc(px(j), py(j), 4, 0, Math.PI * 2);
        handCtx.fill();
      }

      handCtx.shadowBlur = 15;
      var tips = [4, 8, 12, 16, 20];
      for (var ti = 0; ti < tips.length; ti++) {
        var tp = lm[tips[ti]];
        handCtx.fillStyle = '#ffffff';
        handCtx.beginPath();
        handCtx.arc(px(tp), py(tp), 6, 0, Math.PI * 2);
        handCtx.fill();
        handCtx.strokeStyle = color;
        handCtx.lineWidth = 2;
        handCtx.stroke();
      }

      // === СТЕЛЬКА-КОНТРОЛЛЕР ===
      // Рисуем белую овальную стельку под ладонью
      // Соответствует форме твоей серой стельки на фото
      var palmX = px(lm[9]);  // центр ладони
      var palmY = py(lm[9]);
      var palmR = 0;  // радиус

      // Размер стельки зависит от размера руки на экране
      var wristPt = lm[0];
      var midPt = lm[9];
      var handSizePx = Math.sqrt(
        Math.pow((wristPt.x - midPt.x) * W, 2) +
        Math.pow((wristPt.y - midPt.y) * H, 2)
      );
      var soleWidth = handSizePx * 0.9;   // ширина стельки
      var soleHeight = handSizePx * 1.8;  // длина стельки

      // Угол ладони (от запястья к среднему пальцу)
      var midFingerTip = lm[12];
      var angle = Math.atan2(
        (midFingerTip.y - wristPt.y) * H,
        (midFingerTip.x - wristPt.x) * W
      ) - Math.PI / 2;  // стелька "вдоль" ладони

      handCtx.save();
      handCtx.translate(palmX, palmY);
      handCtx.rotate(angle);

      // Тень/свечение стельки
      handCtx.shadowColor = '#ffffff';
      handCtx.shadowBlur = 20;

      // Белая стелька (скруглённый овал)
      handCtx.fillStyle = 'rgba(255,255,255,0.92)';
      handCtx.beginPath();
      // Используем эллипс
      handCtx.ellipse(0, 0, soleWidth / 2, soleHeight / 2, 0, 0, Math.PI * 2);
      handCtx.fill();

      // Внутренняя тёмная окантовка — для сходства со стелькой
      handCtx.shadowBlur = 0;
      handCtx.strokeStyle = 'rgba(60,60,70,0.55)';
      handCtx.lineWidth = 2;
      handCtx.beginPath();
      handCtx.ellipse(0, 0, soleWidth / 2 - 3, soleHeight / 2 - 3, 0, 0, Math.PI * 2);
      handCtx.stroke();

      // Если рука сжата — стелька подсвечивается ярче и появляется точка активации
      if (data.isSqueezed) {
        handCtx.shadowColor = '#44ffaa';
        handCtx.shadowBlur = 30;
        handCtx.fillStyle = 'rgba(68,255,170,0.35)';
        handCtx.beginPath();
        handCtx.ellipse(0, 0, soleWidth / 2 + 6, soleHeight / 2 + 6, 0, 0, Math.PI * 2);
        handCtx.fill();

        // Центральная точка — "триггер"
        handCtx.shadowBlur = 0;
        handCtx.fillStyle = '#44ffaa';
        handCtx.beginPath();
        handCtx.arc(0, 0, 6, 0, Math.PI * 2);
        handCtx.fill();
      }

      handCtx.restore();
      handCtx.shadowBlur = 0;
    }
  }

  // ============ РУКИ В МИРЕ ============
  var HAND_DIST = 1.8;
  function getHandWorldPos(h) {
    var ndcX = h.x * 2 - 1;
    var ndcY = -(h.y * 2 - 1);
    var vec = new THREE.Vector3(ndcX, ndcY, 0.5).unproject(camera);
    var dir = vec.sub(camera.position).normalize();
    return camera.position.clone().add(dir.multiplyScalar(HAND_DIST));
  }

  // ============ РЕЖИМ ============
  var mode = 'menu';
  var running = false;

  // ============ ПОДСВЕТКА КНОПОК ============
  function updateButtonHover() {
    if (!handData.length) {
      playBtnMat.color.setHex(0x44ff88);
      playBtnMat.opacity = 0.9;
      backBtnMat.color.setHex(0x662288);
      backBtnMat.opacity = 0.9;
      return;
    }
    var handPos = getHandWorldPos(handData[0]);
    var playWorld = new THREE.Vector3();
    playBtnGroup.getWorldPosition(playWorld);
    if (mode === 'menu' && handPos.distanceTo(playWorld) < 0.6) {
      playBtnMat.color.setHex(0x88ffaa);
      playBtnMat.opacity = 1;
    } else {
      playBtnMat.color.setHex(0x44ff88);
      playBtnMat.opacity = 0.9;
    }
    var backWorld = new THREE.Vector3();
    backBtnGroup.getWorldPosition(backWorld);
    if (mode === 'game' && handPos.distanceTo(backWorld) < 0.6) {
      backBtnMat.color.setHex(0xaa44cc);
      backBtnMat.opacity = 1;
    } else {
      backBtnMat.color.setHex(0x662288);
      backBtnMat.opacity = 0.9;
    }
  }

  function enterGame() {
    mode = 'game';
    menuScene.visible = false;
    gameScene.visible = true;
    showToast('🎮 Добро пожаловать на работу!', 2500);
  }

  function exitToMenu() {
    mode = 'menu';
    menuScene.visible = true;
    gameScene.visible = false;
    currentTask = 0;
    for (var i = 0; i < grabbables.length; i++) {
      grabbables[i].mesh.position.copy(grabbables[i].home);
    }
    updateTaskText(tasks[0].text);
    for (var t = 0; t < tasks.length; t++) tasks[t].done = false;
    showToast('Возврат в меню', 1500);
  }

  // ============ ХВАТАНИЕ (только при сжатой руке-стельке) ============
  var heldBy = new Map();  // mesh -> handIndex

  function updateGrab() {
    if (mode !== 'game') return;
    if (!handData.length) { heldBy.clear(); return; }

    var handWorlds = handData.map(function(h) { return getHandWorldPos(h); });

    for (var gi = 0; gi < grabbables.length; gi++) {
      var item = grabbables[gi];
      var mesh = item.mesh;

      // Уже держится?
      var holderIdx = -1;
      heldBy.forEach(function(v, k) { if (k === mesh) holderIdx = v; });

      if (holderIdx >= 0 && holderIdx < handWorlds.length) {
        var hand = handData[holderIdx];
        var target = handWorlds[holderIdx].clone();
        mesh.position.lerp(target, 0.3);

        // Отпускание: рука разжалась ИЛИ слишком далеко
        if (!hand.isSqueezed || mesh.position.distanceTo(target) > 0.6) {
          heldBy.delete(mesh);
        }
        continue;
      }

      // Хватание: рука СЖАТА и близко
      for (var hi = 0; hi < handWorlds.length; hi++) {
        var hand = handData[hi];
        if (!hand.isSqueezed) continue;  // хватает только сжатая рука

        var hw = handWorlds[hi];
        var d = mesh.position.distanceTo(hw);
        if (d < 0.35) {
          var busy = false;
          heldBy.forEach(function(v) { if (v === hi) busy = true; });
          if (busy) continue;
          heldBy.set(mesh, hi);
          break;
        }
      }
    }

    // Проверка заданий
    if (currentTask < tasks.length && !tasks[currentTask].done) {
      var task = tasks[currentTask];
      if (task.target === 'яблоко') {
        var appleItem = null;
        for (var ai = 0; ai < grabbables.length; ai++) {
          if (grabbables[ai].name === 'яблоко') { appleItem = grabbables[ai]; break; }
        }
        if (appleItem) {
          var trashWorld = new THREE.Vector3();
          trashGroup.getWorldPosition(trashWorld);
          trashWorld.y += 0.4;
          if (appleItem.mesh.position.distanceTo(trashWorld) < 0.5) {
            task.done = true;
            showToast('✅ ' + task.text, 1500);
            setTimeout(nextTask, 800);
          }
        }
      } else if (task.target === 'степлер') {
        for (var si = 0; si < grabbables.length; si++) {
          if (grabbables[si].name === 'степлер') {
            if (grabbables[si].mesh.position.y < 0.3 && !heldBy.has(grabbables[si].mesh)) {
              task.done = true;
              showToast('✅ ' + task.text, 1500);
              setTimeout(nextTask, 800);
            }
            break;
          }
        }
      } else {
        for (var ti = 0; ti < grabbables.length; ti++) {
          if (grabbables[ti].name === task.target && heldBy.has(grabbables[ti].mesh)) {
            task.done = true;
            showToast('✅ ' + task.text, 1500);
            setTimeout(nextTask, 800);
            break;
          }
        }
      }
    }
  }

  // ============ ГРАВИТАЦИЯ (с коллизией стола) ============
  function updateGravity(dt) {
    if (mode !== 'game') return;
    for (var i = 0; i < grabbables.length; i++) {
      var mesh = grabbables[i].mesh;
      if (heldBy.has(mesh)) continue;

      var x = mesh.position.x;
      var z = mesh.position.z;
      var y = mesh.position.y;

      // Если предмет НАД столешницей — он не может упасть ниже DESK_TOP_Y
      var minY;
      if (isOverDesk(x, z)) {
        minY = DESK_TOP_Y;  // стоит на столе
      } else {
        minY = 0.15;        // лежит на полу
      }

      if (y > minY) {
        mesh.position.y -= dt * 2.5;
        if (mesh.position.y < minY) mesh.position.y = minY;
      } else if (y < minY - 0.01) {
        // Если предмет оказался ниже положенного (например, выпал за пределы стола)
        // ничего не делаем — пусть падает до пола
      }
    }
  }

  // ============ АНИМАЦИЯ ============
  var lastT = performance.now() / 1000;
  var handDrawAccum = 0;
  var HAND_DRAW_INTERVAL = 1/30;

  function animate() {
    requestAnimationFrame(animate);
    var now = performance.now() / 1000;
    var dt = now - lastT;
    lastT = now;
    if (dt > 0.1) dt = 0.1;
    if (dt < 0) dt = 0;

    currentYaw   += (targetYaw   - currentYaw)   * Math.min(1, dt * 12);
    currentPitch += (targetPitch - currentPitch) * Math.min(1, dt * 12);
    camera.rotation.y = currentYaw;
    camera.rotation.x = currentPitch;
    camera.rotation.z = 0;

    pano.position.copy(camera.position);

    if (running) {
      updateButtonHover();
      updateGrab();
      updateGravity(dt);
    }

    handDrawAccum += dt;
    if (handDrawAccum >= HAND_DRAW_INTERVAL) {
      handDrawAccum = 0;
      drawHands();
    }

    renderer.render(scene, camera);
  }

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    canvasHand.width = w;
    canvasHand.height = h;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function() { setTimeout(resize, 200); });
  resize();

  // ============ СТАРТ ============
  startBtn.addEventListener('click', function() {
    startBtn.disabled = true;
    startBtn.textContent = 'Запуск...';
    statusEl.textContent = 'Запускаем камеру...';
    goFullscreen();

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      startBtn.disabled = false;
      startBtn.textContent = '❌ Нет камеры';
      return;
    }

    navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: 'environment' },  // ← ЗАДНЯЯ КАМЕРА
        width: { ideal: 640 },
        height: { ideal: 480 }
      }
    }).then(function(stream) {
      videoEl.srcObject = stream;
      return videoEl.play();
    }).then(function() {
      // Скрываем кнопку старта полностью
      startBtn.style.display = 'none';
      running = true;
      lastT = performance.now() / 1000;
      mpBar.classList.remove('hidden');
      mpStatus.textContent = 'Загрузка рук...';
      mpFill.style.width = '0%';
      mpPct.textContent = '0%';
      statusEl.textContent = 'Тапни по кнопке "ИГРАТЬ" или сожми руку рядом с предметом';
      initHands();
    }).catch(function(err) {
      console.error(err);
      startBtn.disabled = false;
      startBtn.textContent = '❌ Повторить';
      statusEl.textContent = '❌ Камера: ' + (err.name || err.message || 'ошибка');
    });
  });

  animate();
})();
</script>
