<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hand Tracking 3D · Цветные шары</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 100;
            pointer-events: none;
        }
        #status {
            position: absolute;
            bottom: 25px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255,255,255,0.8);
            font-size: 15px;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            width: fit-content;
            margin: 0 auto;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 100;
            pointer-events: none;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        /* Видео скрыто, но нужно для MediaPipe */
        #video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.15; /* слегка видно для ориентации, можно поставить 0 */
            pointer-events: none;
            z-index: 0;
            transform: scaleX(-1); /* зеркалим для естественности */
        }
        #three-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* чтобы не мешал, но мышь не нужна */
        }
        #hand-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
            transform: scaleX(-1); /* зеркалим отрисовку рук для соответствия видео */
        }
    </style>
</head>
<body>
    <div id="info">✋ Управляй шарами руками</div>
    <div id="status">Загрузка камеры...</div>
    
    <video id="video" autoplay playsinline muted></video>
    <canvas id="three-canvas"></canvas>
    <canvas id="hand-canvas"></canvas>

    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        (function() {
            // --- Инициализация сцены Three.js ---
            const canvas3d = document.getElementById('three-canvas');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a20);
            
            // Добавим немного тумана и звёзд для глубины
            scene.fog = new THREE.FogExp2(0x0a0a20, 0.02);
            
            const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 12);
            
            const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: false, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = false; // для производительности
            
            // Освещение
            const ambientLight = new THREE.AmbientLight(0x404060);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);
            
            const backLight = new THREE.PointLight(0x4466ff, 0.5);
            backLight.position.set(-5, 0, -5);
            scene.add(backLight);
            
            const colorLight1 = new THREE.PointLight(0xff44aa, 0.6);
            colorLight1.position.set(5, 5, 5);
            scene.add(colorLight1);
            
            const colorLight2 = new THREE.PointLight(0x44ffaa, 0.6);
            colorLight2.position.set(-5, -5, 5);
            scene.add(colorLight2);
            
            // Звёзды (частицы)
            const starsGeometry = new THREE.BufferGeometry();
            const starsCount = 1500;
            const starPositions = new Float32Array(starsCount * 3);
            for (let i = 0; i < starsCount * 3; i += 3) {
                starPositions[i] = (Math.random() - 0.5) * 200;
                starPositions[i+1] = (Math.random() - 0.5) * 200;
                starPositions[i+2] = (Math.random() - 0.5) * 200 - 50;
            }
            starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true, opacity: 0.8 });
            const stars = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(stars);
            
            // --- Создаём цветные 3D шары (перетаскиваемые объекты) ---
            const spheres = [];
            const sphereCount = 7;
            const colors = [0xff3366, 0x33ff99, 0x33aaff, 0xffaa33, 0xaa44ff, 0xff44aa, 0x44ffaa];
            
            // Позиции для старта (расположим полукругом)
            const startPositions = [
                { x: -4, y: 2, z: 0 },
                { x: -2, y: -1, z: 1 },
                { x: 0, y: 3, z: -1 },
                { x: 2, y: -2, z: 2 },
                { x: 4, y: 1, z: -1 },
                { x: -3, y: -3, z: 1 },
                { x: 3, y: 3, z: 0 }
            ];
            
            // Создаём соединительные линии (они будут обновляться динамически)
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
            const lines = [];
            
            for (let i = 0; i < sphereCount; i++) {
                const color = colors[i % colors.length];
                const geometry = new THREE.SphereGeometry(0.7, 32, 32);
                const material = new THREE.MeshStandardMaterial({
                    color: color,
                    emissive: new THREE.Color(color).multiplyScalar(0.3),
                    roughness: 0.2,
                    metalness: 0.1,
                    emissiveIntensity: 0.8
                });
                const sphere = new THREE.Mesh(geometry, material);
                
                // Начальная позиция
                const pos = startPositions[i];
                sphere.position.set(pos.x, pos.y, pos.z);
                
                // Добавим маленькое свечение (нимб)
                const glowGeometry = new THREE.SphereGeometry(0.85, 16, 16);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.15,
                    side: THREE.BackSide
                });
                const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                sphere.add(glow);
                
                sphere.userData = {
                    color: color,
                    index: i,
                    isDragged: false,
                    handIndex: null, // какая рука держит (0 или 1)
                    originalPos: new THREE.Vector3(pos.x, pos.y, pos.z)
                };
                
                scene.add(sphere);
                spheres.push(sphere);
            }
            
            // Создаём линии между всеми парами шаров (будем обновлять их позиции)
            const linePairs = [];
            for (let i = 0; i < sphereCount; i++) {
                for (let j = i + 1; j < sphereCount; j++) {
                    const points = [
                        spheres[i].position.clone(),
                        spheres[j].position.clone()
                    ];
                    const geometry = new THREE.BufferGeometry().setFromPoints(points);
                    const line = new THREE.Line(geometry, lineMaterial.clone());
                    line.userData = { a: i, b: j };
                    scene.add(line);
                    lines.push(line);
                    linePairs.push({ a: i, b: j, line: line });
                }
            }
            
            // --- Отрисовка рук на 2D canvas ---
            const handCanvas = document.getElementById('hand-canvas');
            const handCtx = handCanvas.getContext('2d');
            
            function resizeHandCanvas() {
                handCanvas.width = window.innerWidth;
                handCanvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeHandCanvas);
            resizeHandCanvas();
            
            // --- MediaPipe Hands ---
            const videoElement = document.getElementById('video');
            const statusDiv = document.getElementById('status');
            
            let handsResults = null; // последние результаты
            let handLandmarks = []; // массив рук (нормализованные координаты)
            
            // Сопоставление рук и шаров
            const handSphereMap = new Map(); // key: handIndex (0,1), value: sphereIndex
            
            // Инициализация Hands
            const hands = new Hands({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`;
                }
            });
            
            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });
            
            hands.onResults(onResults);
            
            // Функция обработки результатов
            function onResults(results) {
                handsResults = results;
                handLandmarks = results.multiHandLandmarks || [];
                
                // Обновляем статус
                if (handLandmarks.length > 0) {
                    statusDiv.textContent = `✋ Обнаружено рук: ${handLandmarks.length}`;
                } else {
                    statusDiv.textContent = '✋ Покажите руки в кадре';
                }
                
                // Обрабатываем перетаскивание
                processHands(handLandmarks);
                
                // Рисуем руки на 2D canvas
                drawHands(handLandmarks);
            }
            
            // --- Логика перетаскивания ---
            // Мы используем запястье (landmark 0) для управления
            // Но также можно использовать средний палец (landmark 9) для точности
            // Возьмём landmark 9 (середина ладони) для более стабильного контроля
            
            // Функция преобразования нормализованных координат в 3D позицию
            // Нормализованные координаты MediaPipe: x [0,1] слева направо, y [0,1] сверху вниз
            // Мы зеркалим X, т.к. видео зеркальное, и переводим в мировые координаты Three.js
            function mapTo3D(nx, ny) {
                // Зеркалим X для естественного управления (левая рука управляет левой частью экрана)
                const mirroredX = 1.0 - nx;
                // Преобразуем в диапазон: X: -6..6, Y: -4..4, Z: оставим 0..3 в зависимости от глубины? 
                // Но у нас нет глубины из MediaPipe, поэтому Z фиксируем или используем небольшое значение
                const x = (mirroredX - 0.5) * 14; // -7..7
                const y = (0.5 - ny) * 9; // -4.5..4.5, инвертируем Y
                // Z можно сделать зависимым от размера руки? Или просто 0. Выберем небольшое случайное смещение для объёма.
                // Или используем z = 1.5 для всех, чтобы было ближе к камере.
                return new THREE.Vector3(x, y, 1.5);
            }
            
            function processHands(landmarks) {
                // Сбрасываем флаги isDragged у всех шаров
                spheres.forEach(s => { s.userData.isDragged = false; s.userData.handIndex = null; });
                
                // Для каждой руки определяем, какой шар она контролирует
                const usedSphereIndices = new Set();
                
                // Сначала определим, какие шары уже "захвачены" (если рука близко к шару)
                // Стратегия: для каждой руки ищем ближайший шар в пределах радиуса захвата
                // Если рука уже держала шар в прошлом кадре, пытаемся сохранить захват
                
                // Собираем информацию о руках
                const handInfos = [];
                for (let h = 0; h < landmarks.length; h++) {
                    const hand = landmarks[h];
                    // Используем landmark 9 (середина ладони) для позиции
                    const palm = hand[9];
                    // Также можно использовать запястье (0)
                    const wrist = hand[0];
                    // Возьмём среднее между 9 и 0 для стабильности
                    const nx = (palm.x + wrist.x) / 2;
                    const ny = (palm.y + wrist.y) / 2;
                    
                    const pos3D = mapTo3D(nx, ny);
                    handInfos.push({ index: h, pos3D, nx, ny });
                }
                
                // Сначала проверим, есть ли уже активные захваты (из предыдущего кадра) - но у нас нет хранения между кадрами,
                // поэтому будем делать просто: для каждой руки ищем ближайший свободный шар.
                // Однако, чтобы избежать "перепрыгивания", можно добавить гистерезис, но для простоты сделаем так:
                // Сортируем руки по расстоянию до шаров и назначаем.
                
                // Создаём список возможных пар (рука-шар) с расстояниями
                const pairs = [];
                for (const h of handInfos) {
                    for (let s = 0; s < spheres.length; s++) {
                        const sphere = spheres[s];
                        const dist = h.pos3D.distanceTo(sphere.position);
                        pairs.push({ handIdx: h.index, sphereIdx: s, dist, handPos: h.pos3D, spherePos: sphere.position.clone() });
                    }
                }
                
                // Сортируем по расстоянию
                pairs.sort((a, b) => a.dist - b.dist);
                
                const assignedHands = new Set();
                const assignedSpheres = new Set();
                
                // Порог захвата (в мировых единицах)
                const grabThreshold = 2.2;
                
                for (const pair of pairs) {
                    if (assignedHands.has(pair.handIdx)) continue;
                    if (assignedSpheres.has(pair.sphereIdx)) continue;
                    if (pair.dist > grabThreshold) continue;
                    
                    // Назначаем
                    assignedHands.add(pair.handIdx);
                    assignedSpheres.add(pair.sphereIdx);
                    
                    const sphere = spheres[pair.sphereIdx];
                    sphere.userData.isDragged = true;
                    sphere.userData.handIndex = pair.handIdx;
                    
                    // Перемещаем шар в позицию руки
                    sphere.position.copy(pair.handPos);
                }
                
                // Обновляем линии между шарами (расстояния)
                updateLines();
            }
            
            function updateLines() {
                // Обновляем геометрию линий
                for (const pair of linePairs) {
                    const a = spheres[pair.a].position;
                    const b = spheres[pair.b].position;
                    
                    // Меняем прозрачность в зависимости от расстояния
                    const dist = a.distanceTo(b);
                    const opacity = Math.max(0.1, Math.min(0.8, 2.5 / (dist + 0.5)));
                    const color = new THREE.Color().setHSL((dist * 0.1) % 1, 0.8, 0.6);
                    
                    pair.line.material.opacity = opacity * 0.6;
                    pair.line.material.color = color;
                    
                    // Обновляем позиции
                    const positions = pair.line.geometry.attributes.position.array;
                    positions[0] = a.x; positions[1] = a.y; positions[2] = a.z;
                    positions[3] = b.x; positions[4] = b.y; positions[5] = b.z;
                    pair.line.geometry.attributes.position.needsUpdate = true;
                }
            }
            
            // --- Отрисовка рук на 2D canvas ---
            function drawHands(landmarks) {
                handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);
                
                if (!landmarks || landmarks.length === 0) return;
                
                // Соединения для скелета руки (MediaPipe Hands)
                const connections = [
                    [0, 1], [1, 2], [2, 3], [3, 4], // большой палец
                    [0, 5], [5, 6], [6, 7], [7, 8], // указательный
                    [5, 9], [9, 10], [10, 11], [11, 12], // средний
                    [9, 13], [13, 14], [14, 15], [15, 16], // безымянный
                    [13, 17], [17, 18], [18, 19], [19, 20], // мизинец
                    [0, 17] // ладонь
                ];
                
                for (const hand of landmarks) {
                    // Рисуем линии
                    handCtx.strokeStyle = '#00ffff';
                    handCtx.lineWidth = 3;
                    handCtx.shadowColor = '#00ffff';
                    handCtx.shadowBlur = 10;
                    
                    for (const [i, j] of connections) {
                        const p1 = hand[i];
                        const p2 = hand[j];
                        
                        // Переводим в координаты canvas (с учётом зеркалирования уже на canvas)
                        // handCanvas уже зеркален через CSS transform: scaleX(-1)
                        // Поэтому координаты X используем как есть (0..1) и умножаем на ширину
                        const x1 = p1.x * handCanvas.width;
                        const y1 = p1.y * handCanvas.height;
                        const x2 = p2.x * handCanvas.width;
                        const y2 = p2.y * handCanvas.height;
                        
                        handCtx.beginPath();
                        handCtx.moveTo(x1, y1);
                        handCtx.lineTo(x2, y2);
                        handCtx.stroke();
                    }
                    
                    // Рисуем точки
                    handCtx.shadowBlur = 15;
                    for (const point of hand) {
                        const x = point.x * handCanvas.width;
                        const y = point.y * handCanvas.height;
                        
                        // Разный цвет для кончиков пальцев
                        if (point.z < 0) { // условно, если палец ближе к камере
                            handCtx.fillStyle = '#ff44aa';
                        } else {
                            handCtx.fillStyle = '#44ffaa';
                        }
                        handCtx.beginPath();
                        handCtx.arc(x, y, 6, 0, 2 * Math.PI);
                        handCtx.fill();
                    }
                }
                handCtx.shadowBlur = 0;
            }
            
            // --- Запуск камеры и MediaPipe ---
            async function startCamera() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
                    });
                    videoElement.srcObject = stream;
                    await videoElement.play();
                    
                    statusDiv.textContent = '✋ Покажите руки в кадре';
                    
                    // Запускаем цикл обработки MediaPipe
                    async function processFrame() {
                        if (videoElement.readyState >= 2) {
                            await hands.send({ image: videoElement });
                        }
                        requestAnimationFrame(processFrame);
                    }
                    processFrame();
                    
                } catch (err) {
                    console.error('Ошибка камеры:', err);
                    statusDiv.textContent = '❌ Нет доступа к камере. Разрешите доступ.';
                }
            }
            
            // --- Анимация Three.js ---
            function animate() {
                requestAnimationFrame(animate);
                
                // Лёгкое вращение звёзд для динамики
                stars.rotation.y += 0.0002;
                stars.rotation.x += 0.0001;
                
                // Пульсация шаров
                const time = Date.now() * 0.002;
                spheres.forEach((sphere, idx) => {
                    sphere.scale.setScalar(1 + Math.sin(time + idx) * 0.05);
                    // Немного вращаем свечение
                    if (sphere.children[0]) {
                        sphere.children[0].rotation.y += 0.01;
                    }
                });
                
                // Обновляем линии, если шары двигаются вручную (не через руки)
                // (updateLines уже вызывается в processHands, но на всякий случай)
                // Но чтобы не дублировать, оставим только в processHands
                
                renderer.render(scene, camera);
            }
            
            // --- Обработка ресайза ---
            function onResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                resizeHandCanvas();
            }
            window.addEventListener('resize', onResize);
            
            // Запуск
            startCamera();
            animate();
            
            // Обновляем линии раз в кадр на случай, если шары двигаются не руками
            setInterval(() => {
                // Если руки не обнаружены, всё равно обновляем линии для консистентности
                if (!handLandmarks || handLandmarks.length === 0) {
                    updateLines();
                }
            }, 100);
            
            // Добавим немного интерактивности: если долго нет рук, шары медленно возвращаются?
            // Нет, оставим как есть.
            
            console.log('Игра запущена! Управляйте шарами руками.');
        })();
    </script>
</body>
</html>
