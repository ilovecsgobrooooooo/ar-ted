<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cube Runner VR — белые руки</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #video {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 1;
  }
  /* Слой рук — поверх видео, но под HUD */
  #hand-canvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 2;
    pointer-events: none;
    /* лёгкое свечение всего слоя */
    mix-blend-mode: screen;
  }
  #three-canvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 3;
    pointer-events: none;
    background: transparent;
  }
  #hud {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    left: 50%; transform: translateX(-50%);
    z-index: 100;
    display: flex; gap: 10px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 12px rgba(0,0,0,0.9);
  }
  .pill {
    background: rgba(0,0,0,0.45);
    padding: 8px 16px;
    border-radius: 30px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    font-size: 15px;
  }
  #score { color: #44ffaa; }
  #combo { color: #ffdd00; }
  #start-btn {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 200;
    padding: 24px 48px;
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, #ff3366, #aa44ff);
    border: none; border-radius: 60px;
    box-shadow: 0 10px 40px rgba(170,68,255,0.6);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    letter-spacing: 1px;
  }
  #start-btn:active { transform: translate(-50%, -50%) scale(0.95); }
  #start-btn.hidden { display: none; }
  #status {
    position: fixed;
    bottom: max(20px, env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 12px;
    background: rgba(0,0,0,0.5);
    padding: 6px 14px; border-radius: 20px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 100; white-space: nowrap;
  }
  #flash {
    position: fixed; inset: 0;
    background: #fff; opacity: 0;
    pointer-events: none;
    z-index: 90;
    transition: opacity 0.15s;
  }
</style>
</head>
<body>

<video id="video" playsinline autoplay muted></video>
<canvas id="hand-canvas"></canvas>
<canvas id="three-canvas"></canvas>
<div id="flash"></div>

<div id="hud">
  <div class="pill">Очки: <span id="score">0</span></div>
  <div class="pill">Комбо: <span id="combo">x1</span></div>
</div>

<div id="status">Нажми старт чтобы начать</div>
<button id="start-btn">▶ ИГРАТЬ</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(async function() {
  'use strict';

  const videoEl    = document.getElementById('video');
  const canvas3d   = document.getElementById('three-canvas');
  const canvasHand = document.getElementById('hand-canvas');
  const handCtx    = canvasHand.getContext('2d', { alpha: true });
  const startBtn   = document.getElementById('start-btn');
  const statusEl   = document.getElementById('status');
  const scoreEl    = document.getElementById('score');
  const comboEl    = document.getElementById('combo');
  const flashEl    = document.getElementById('flash');

  // ====== THREE.JS ======
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({
    canvas: canvas3d,
    antialias: false,
    powerPreference: 'high-performance',
    alpha: true,
    stencil: false
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.setClearColor(0x000000, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 1.0));
  const dl = new THREE.DirectionalLight(0xffffff, 0.8);
  dl.position.set(0, 3, 2);
  scene.add(dl);

  // ====== КУБЫ (пул) ======
  const CUBE_COLORS = [0xff3366, 0x33ff99, 0x33aaff, 0xffaa33, 0xaa44ff, 0xff44aa, 0x44ffaa, 0xff6633];
  const cubes = [];
  const CUBE_POOL = 30;
  const cubeGeo = new THREE.BoxGeometry(1, 1, 1);

  for (let i = 0; i < CUBE_POOL; i++) {
    const color = CUBE_COLORS[i % CUBE_COLORS.length];
    const mat = new THREE.MeshLambertMaterial({ color, emissive: color, emissiveIntensity: 0.35 });
    const cube = new THREE.Mesh(cubeGeo, mat);
    cube.visible = false;
    cube.userData = { active: false, speed: 0, color, hit: false, rotSpeed: new THREE.Vector3() };
    scene.add(cube);
    cubes.push(cube);
  }

  // ====== ЧАСТИЦЫ ======
  const PARTICLE_COUNT = 180;
  const particleGeo = new THREE.BufferGeometry();
  const pPos = new Float32Array(PARTICLE_COUNT * 3);
  const pVel = new Float32Array(PARTICLE_COUNT * 3);
  const pLife = new Float32Array(PARTICLE_COUNT);
  const pCol = new Float32Array(PARTICLE_COUNT * 3);
  particleGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  particleGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
  const particles = new THREE.Points(particleGeo, new THREE.PointsMaterial({
    size: 0.3, vertexColors: true, transparent: true, opacity: 0.95, depthWrite: false
  }));
  particles.frustumCulled = false;
  scene.add(particles);
  let pIdx = 0;
  for (let i = 0; i < PARTICLE_COUNT; i++) pLife[i] = 0;

  function spawnParticles(pos, color, count = 14) {
    const c = new THREE.Color(color);
    for (let i = 0; i < count; i++) {
      const k = pIdx; pIdx = (pIdx + 1) % PARTICLE_COUNT;
      pPos[k*3] = pos.x; pPos[k*3+1] = pos.y; pPos[k*3+2] = pos.z;
      pVel[k*3]   = (Math.random() - 0.5) * 10;
      pVel[k*3+1] = (Math.random() - 0.5) * 10;
      pVel[k*3+2] = (Math.random() - 0.5) * 10;
      pCol[k*3] = c.r; pCol[k*3+1] = c.g; pCol[k*3+2] = c.b;
      pLife[k] = 1.0;
    }
    particleGeo.attributes.position.needsUpdate = true;
    particleGeo.attributes.color.needsUpdate = true;
  }

  // ====== ИГРОВОЕ СОСТОЯНИЕ ======
  let running = false;
  let score = 0, combo = 1, comboTimer = 0;
  let spawnTimer = 0, spawnInterval = 0.85, gameSpeed = 20, elapsed = 0;

  function resetGame() {
    score = 0; combo = 1; comboTimer = 0;
    spawnTimer = 0; gameSpeed = 20; elapsed = 0;
    scoreEl.textContent = '0';
    comboEl.textContent = 'x1';
    for (const c of cubes) { c.visible = false; c.userData.active = false; }
    for (let i = 0; i < PARTICLE_COUNT; i++) pLife[i] = 0;
  }

  function spawnCube() {
    for (const cube of cubes) {
      if (cube.userData.active) continue;
      cube.userData.active = true;
      cube.userData.hit = false;
      cube.userData.speed = gameSpeed * (0.85 + Math.random() * 0.3);
      const color = CUBE_COLORS[Math.floor(Math.random() * CUBE_COLORS.length)];
      cube.material.color.setHex(color);
      cube.material.emissive.setHex(color);
      cube.userData.color = color;

      const fov = camera.fov * Math.PI / 180;
      const dist = 60;
      const visH = 2 * Math.tan(fov / 2) * dist;
      const visW = visH * camera.aspect;
      cube.position.x = (Math.random() - 0.5) * visW * 0.9;
      cube.position.y = (Math.random() - 0.5) * visH * 0.75;
      cube.position.z = -dist;
      cube.rotation.set(Math.random()*6, Math.random()*6, Math.random()*6);
      cube.userData.rotSpeed.set(
        (Math.random() - 0.5) * 2,
        (Math.random() - 0.5) * 2,
        (Math.random() - 0.5) * 2
      );
      cube.visible = true;
      return;
    }
  }

  // ====== MEDIAPIPE ======
  let handsReady = false;
  let handData = [];  // [{x, y, landmarks}]

  const hands = new Hands({
    locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`
  });

  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 0,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5,
    selfieMode: false   // задняя камера
  });

  hands.onResults((results) => {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length) {
      handData = results.multiHandLandmarks.map(lm => {
        // центр ладони
        const ids = [0, 5, 9, 13, 17];
        let x = 0, y = 0;
        for (const id of ids) { x += lm[id].x; y += lm[id].y; }
        return { x: x / ids.length, y: y / ids.length, landmarks: lm };
      });
    } else {
      handData = [];
    }
  });

  await hands.initialize();
  handsReady = true;

  // ====== МИР ↔ ЭКРАН ======
  const fovRad = camera.fov * Math.PI / 180;
  function screenToWorldAtZ(nx, ny, z) {
    const d = Math.abs(z);
    const visH = 2 * Math.tan(fovRad / 2) * d;
    const visW = visH * camera.aspect;
    return new THREE.Vector3((nx - 0.5) * visW, (0.5 - ny) * visH, z);
  }

  // ====== ЛОВЛЯ ======
  const CATCH_PLANE_Z = -7;
  const CATCH_RADIUS = 2.0;

  function checkHits() {
    if (!handData.length) return;
    const handWorlds = handData.map(h => screenToWorldAtZ(h.x, h.y, CATCH_PLANE_Z));

    for (const cube of cubes) {
      if (!cube.userData.active) continue;
      if (cube.position.z > CATCH_PLANE_Z + 2) continue;
      if (cube.position.z < CATCH_PLANE_Z - 4) continue;
      for (const hw of handWorlds) {
        const dx = cube.position.x - hw.x;
        const dy = cube.position.y - hw.y;
        if (dx*dx + dy*dy < CATCH_RADIUS * CATCH_RADIUS) {
          cube.userData.active = false;
          cube.visible = false;
          score += 10 * combo;
          combo = Math.min(combo + 1, 8);
          comboTimer = 2.0;
          scoreEl.textContent = score;
          comboEl.textContent = 'x' + combo;
          spawnParticles(cube.position, cube.userData.color, 14);
          flashEl.style.opacity = 0.12;
          setTimeout(() => { flashEl.style.opacity = 0; }, 60);
          break;
        }
      }
    }
  }

  // ====== БЕЛЫЕ РУКИ ======
  // Рисуем залитый белый силуэт ладони: соединяем точки скелета,
  // получаем полигон, заливаем белым с мягким краем и свечением.
  const HAND_POLYGON = [
    0,   // запястье
    1, 2, 3, 4,        // большой
    5, 6, 7, 8,        // указательный
    9, 10, 11, 12,     // средний
    13, 14, 15, 16,    // безымянный
    17, 18, 19, 20,    // мизинец
    17, 13, 9, 5, 0    // обратно по ладони
  ];

  function drawWhiteHands() {
    handCtx.clearRect(0, 0, canvasHand.width, canvasHand.height);
    if (!handData.length) return;

    const W = canvasHand.width, H = canvasHand.height;

    // Свечение под ладонями (мягкое белое пятно)
    handCtx.save();
    handCtx.globalCompositeOperation = 'lighter';
    for (const h of handData) {
      const cx = h.x * W;
      const cy = h.y * H;
      const r = Math.min(W, H) * 0.14;
      const grad = handCtx.createRadialGradient(cx, cy, 0, cx, cy, r);
      grad.addColorStop(0, 'rgba(255,255,255,0.55)');
      grad.addColorStop(0.5, 'rgba(220,230,255,0.25)');
      grad.addColorStop(1, 'rgba(180,200,255,0)');
      handCtx.fillStyle = grad;
      handCtx.beginPath();
      handCtx.arc(cx, cy, r, 0, Math.PI * 2);
      handCtx.fill();
    }
    handCtx.restore();

    // Сам силуэт руки — белый полигон
    for (const h of handData) {
      const lm = h.landmarks;

      // Путь по контуру
      handCtx.beginPath();
      for (let i = 0; i < HAND_POLYGON.length; i++) {
        const p = lm[HAND_POLYGON[i]];
        const x = p.x * W;
        const y = p.y * H;
        if (i === 0) handCtx.moveTo(x, y);
        else handCtx.lineTo(x, y);
      }
      handCtx.closePath();

      // Заливка белым с лёгкой прозрачностью (чтобы видеть мир сквозь)
      handCtx.fillStyle = 'rgba(255,255,255,0.78)';
      handCtx.fill();

      // Внутреннее свечение через тень
      handCtx.shadowColor = '#ffffff';
      handCtx.shadowBlur = 30;
      handCtx.fillStyle = 'rgba(255,255,255,0.35)';
      handCtx.fill();
      handCtx.shadowBlur = 0;
    }
  }

  // ====== ЦИКЛ ОТРИСОВКИ РУК (реже, чем 3D — для производительности) ======
  let handDrawAccum = 0;
  const HAND_DRAW_INTERVAL = 1 / 30; // 30 fps для рук

  // ====== АНИМАЦИЯ ======
  let lastT = performance.now() / 1000;

  function animate() {
    requestAnimationFrame(animate);

    const now = performance.now() / 1000;
    let dt = now - lastT;
    lastT = now;
    if (dt > 0.1) dt = 0.1;

    if (running) {
      elapsed += dt;
      spawnTimer += dt;
      gameSpeed = 20 + elapsed * 0.6;

      if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        spawnCube();
      }

      // Движение кубов
      for (const cube of cubes) {
        if (!cube.userData.active) continue;
        cube.position.z += cube.userData.speed * dt;
        cube.rotation.x += cube.userData.rotSpeed.x * dt;
        cube.rotation.y += cube.userData.rotSpeed.y * dt;
        cube.rotation.z += cube.userData.rotSpeed.z * dt;
        if (cube.position.z > 3) {
          cube.userData.active = false;
          cube.visible = false;
          // промах — сброс комбо
          if (combo > 1) { combo = 1; comboEl.textContent = 'x1'; }
        }
      }

      if (comboTimer > 0) {
        comboTimer -= dt;
        if (comboTimer <= 0) {
          combo = 1; comboEl.textContent = 'x1';
        }
      }

      checkHits();
    }

    // Частицы
    let anyAlive = false;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      if (pLife[i] <= 0) continue;
      anyAlive = true;
      pLife[i] -= dt * 1.6;
      if (pLife[i] < 0) pLife[i] = 0;
      pPos[i*3]   += pVel[i*3]   * dt;
      pPos[i*3+1] += pVel[i*3+1] * dt;
      pPos[i*3+2] += pVel[i*3+2] * dt;
      pVel[i*3]   *= 0.94;
      pVel[i*3+1] *= 0.94;
      pVel[i*3+2] *= 0.94;
    }
    if (anyAlive) {
      particleGeo.attributes.position.needsUpdate = true;
      particles.material.opacity = 0.95;
    } else {
      particles.material.opacity = 0;
    }

    // Отрисовка рук ~30 fps
    handDrawAccum += dt;
    if (handDrawAccum >= HAND_DRAW_INTERVAL) {
      handDrawAccum = 0;
      drawWhiteHands();
    }

    renderer.render(scene, camera);
  }

  // ====== ЦИКЛ MEDIAPIPE ======
  async function sendFrame() {
    if (!handsReady || videoEl.readyState < 2) return;
    try { await hands.send({ image: videoEl }); } catch(e) {}
  }
  function mpLoop() {
    sendFrame();
    requestAnimationFrame(mpLoop);
  }

  // ====== РАЗМЕРЫ ======
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    canvasHand.width = w;
    canvasHand.height = h;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  resize();

  // ====== СТАРТ ======
  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    startBtn.textContent = 'Запуск...';
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },  // ← задняя камера
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      });
      videoEl.srcObject = stream;
      await videoEl.play();

      startBtn.classList.add('hidden');
      statusEl.textContent = 'Держи руки в кадре — лови кубы';
      resetGame();
      running = true;
      lastT = performance.now() / 1000;
      mpLoop();
    } catch (err) {
      console.error(err);
      startBtn.disabled = false;
      startBtn.textContent = '❌ Нет камеры. Повторить';
      statusEl.textContent = 'Разреши доступ к камере в настройках Safari';
    }
  });

  animate();
})();
</script>
</body>
</html>
