<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Job Simulator VR</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
    position: fixed;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #three-canvas { z-index: 1; }
  #hand-canvas  { z-index: 2; pointer-events: none; }
  #touch-layer  { position: fixed; inset: 0; z-index: 5; touch-action: none; }

  #fs-btn {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    right: max(10px, env(safe-area-inset-right));
    z-index: 150;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: manipulation;
  }
  #fs-btn:active { transform: scale(0.9); }

  #start-btn {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 200;
    padding: 22px 46px;
    font-size: 20px; font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, #ff3366, #aa44ff);
    border: none; border-radius: 60px;
    box-shadow: 0 10px 40px rgba(170,68,255,0.6);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    letter-spacing: 1px;
    font-family: inherit;
  }
  #start-btn:active { transform: translate(-50%, -50%) scale(0.95); }
  #start-btn.hidden { display: none; }

  #mp-bar {
    position: fixed;
    top: max(52px, calc(env(safe-area-inset-top) + 40px));
    left: 50%; transform: translateX(-50%);
    z-index: 100;
    width: min(320px, 70vw);
    background: rgba(0,0,0,0.6);
    border-radius: 20px;
    padding: 8px 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    transition: opacity 0.4s, transform 0.4s;
  }
  #mp-bar.hidden {
    opacity: 0;
    transform: translate(-50%, -20px);
    pointer-events: none;
  }
  #mp-label {
    color: #fff; font-size: 11px; font-weight: 600;
    margin-bottom: 5px;
    display: flex; justify-content: space-between; align-items: center;
  }
  #mp-label .status-txt { color: #88aaff; }
  #mp-label .pct { color: #44ffaa; font-variant-numeric: tabular-nums; }
  #mp-track {
    width: 100%; height: 5px;
    background: rgba(255,255,255,0.15);
    border-radius: 4px; overflow: hidden;
  }
  #mp-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4488ff, #aa44ff, #ff44aa);
    border-radius: 4px;
    transition: width 0.2s;
  }

  #status {
    position: fixed;
    bottom: max(12px, env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 12px;
    background: rgba(0,0,0,0.6);
    padding: 6px 14px; border-radius: 20px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 100;
    max-width: 90vw; text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #toast {
    position: fixed;
    bottom: max(60px, calc(env(safe-area-inset-bottom) + 50px));
    left: 50%; transform: translateX(-50%) translateY(20px);
    z-index: 300;
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 12px 20px;
    border-radius: 16px;
    font-size: 13px;
    max-width: 85vw;
    text-align: center;
    line-height: 1.4;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<canvas id="three-canvas"></canvas>
<canvas id="hand-canvas"></canvas>
<div id="touch-layer"></div>

<button id="fs-btn" title="На весь экран">⛶</button>
<div id="toast"></div>
<div id="mp-bar" class="hidden">
  <div id="mp-label">
    <span class="status-txt" id="mp-status">Загрузка рук...</span>
    <span class="pct" id="mp-pct">0%</span>
  </div>
  <div id="mp-track"><div id="mp-fill"></div></div>
</div>
<div id="status">Нажми «Старт» чтобы войти</div>
<button id="start-btn">▶ ВОЙТИ В VR</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function() {
  'use strict';

  var canvas3d   = document.getElementById('three-canvas');
  var canvasHand = document.getElementById('hand-canvas');
  var handCtx    = canvasHand.getContext('2d');
  var touchLayer = document.getElementById('touch-layer');
  var startBtn   = document.getElementById('start-btn');
  var fsBtn      = document.getElementById('fs-btn');
  var statusEl   = document.getElementById('status');
  var mpBar      = document.getElementById('mp-bar');
  var mpFill     = document.getElementById('mp-fill');
  var mpPct      = document.getElementById('mp-pct');
  var mpStatus   = document.getElementById('mp-status');
  var toastEl    = document.getElementById('toast');

  if (typeof THREE === 'undefined') { alert('Three.js не загрузился'); return; }

  // ================= ТОСТ =================
  var toastTimer = null;
  function showToast(text, duration) {
    duration = duration || 3000;
    toastEl.textContent = text;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toastEl.classList.remove('show'); }, duration);
  }

  // ================= THREE.JS =================
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 1000);
  camera.position.set(0, 1.55, 0);
  camera.rotation.order = 'YXZ';

  var renderer = new THREE.WebGLRenderer({
    canvas: canvas3d,
    antialias: true,
    powerPreference: 'high-performance'
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // ================= СТАРЫЙ ФОН (панорама заката) =================
  var panoGeo = new THREE.SphereGeometry(500, 60, 40);
  panoGeo.scale(-1, 1, 1);
  var panoMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  var pano = new THREE.Mesh(panoGeo, panoMat);
  scene.add(pano);

  var gradCanvas = document.createElement('canvas');
  gradCanvas.width = 1024; gradCanvas.height = 512;
  var gctx = gradCanvas.getContext('2d');
  var grad = gctx.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0.0, '#1a1a4e');
  grad.addColorStop(0.4, '#6a3a8a');
  grad.addColorStop(0.6, '#ff6a5a');
  grad.addColorStop(0.8, '#ffae5a');
  grad.addColorStop(1.0, '#3a2050');
  gctx.fillStyle = grad;
  gctx.fillRect(0, 0, 1024, 512);
  for (var i = 0; i < 250; i++) {
    gctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.7) + ')';
    gctx.fillRect(Math.random() * 1024, Math.random() * 220, 2, 2);
  }
  var sunGrad = gctx.createRadialGradient(512, 380, 0, 512, 380, 150);
  sunGrad.addColorStop(0, 'rgba(255,240,180,1)');
  sunGrad.addColorStop(0.4, 'rgba(255,180,100,0.6)');
  sunGrad.addColorStop(1, 'rgba(255,120,80,0)');
  gctx.fillStyle = sunGrad;
  gctx.fillRect(300, 250, 424, 260);
  var gradientTex = new THREE.CanvasTexture(gradCanvas);
  gradientTex.mapping = THREE.EquirectangularReflectionMapping;
  panoMat.map = gradientTex;
  panoMat.needsUpdate = true;

  var texLoader = new THREE.TextureLoader();
  texLoader.crossOrigin = 'anonymous';
  texLoader.load(
    'https://threejs.org/examples/textures/2294472375_24a3b8ef46_o.jpg',
    function(tex) {
      tex.mapping = THREE.EquirectangularReflectionMapping;
      panoMat.map = tex;
      panoMat.needsUpdate = true;
    },
    undefined,
    function() {}
  );

  // ================= СВЕТ =================
  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  var dl = new THREE.DirectionalLight(0xffffff, 1.0);
  dl.position.set(2, 5, 3);
  scene.add(dl);
  var pl1 = new THREE.PointLight(0xffaa66, 1.2, 25); pl1.position.set(0, 4, -3); scene.add(pl1);
  var pl2 = new THREE.PointLight(0x88aaff, 0.8, 25); pl2.position.set(-3, 3, 2); scene.add(pl2);

  // ================= ГРУППЫ СЦЕН =================
  var menuScene = new THREE.Group();  // главное меню
  var gameScene = new THREE.Group();  // офис Job Sim
  gameScene.visible = false;
  scene.add(menuScene);
  scene.add(gameScene);

  // ================================================================
  // ГЛАВНОЕ МЕНЮ (3D панель с кнопкой "ИГРАТЬ")
  // ================================================================
  var menuRoot = new THREE.Group();
  menuRoot.position.set(0, 1.5, -2.5);
  menuScene.add(menuRoot);

  // Панель меню
  var menuBgMat = new THREE.MeshBasicMaterial({
    color: 0x0a0a14, transparent: true, opacity: 0.92, side: THREE.DoubleSide
  });
  var menuBg = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.6), menuBgMat);
  menuRoot.add(menuBg);

  // Рамка
  var borderMat = new THREE.MeshBasicMaterial({
    color: 0x4488ff, transparent: true, opacity: 0.7, side: THREE.DoubleSide
  });
  var border = new THREE.Mesh(new THREE.PlaneGeometry(2.44, 1.64), borderMat);
  border.position.z = -0.001;
  menuRoot.add(border);

  // Заголовок
  var titleCanvas = document.createElement('canvas');
  titleCanvas.width = 1024; titleCanvas.height = 256;
  var tctx = titleCanvas.getContext('2d');
  tctx.fillStyle = '#ffffff';
  tctx.font = 'bold 90px -apple-system, sans-serif';
  tctx.textAlign = 'center'; tctx.textBaseline = 'middle';
  tctx.fillText('JOB SIMULATOR', 512, 90);
  tctx.font = '44px -apple-system, sans-serif';
  tctx.fillStyle = '#88aaff';
  tctx.fillText('VR EXPERIENCE', 512, 180);
  var titleMat = new THREE.MeshBasicMaterial({
    map: new THREE.CanvasTexture(titleCanvas), transparent: true
  });
  var titleMesh = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 0.5), titleMat);
  titleMesh.position.set(0, 0.5, 0.01);
  menuRoot.add(titleMesh);

  // ============ КНОПКА "ИГРАТЬ" ============
  // Обычная 3D кнопка, наводишь руку → подсвечивается → 2 сек → срабатывает
  var playBtnGroup = new THREE.Group();
  playBtnGroup.position.set(0, -0.2, 0.01);
  menuRoot.add(playBtnGroup);

  var playBtnMat = new THREE.MeshBasicMaterial({
    color: 0x44ff88,
    transparent: true,
    opacity: 0.85,
    side: THREE.DoubleSide
  });
  var playBtn = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.5), playBtnMat);
  playBtnGroup.add(playBtn);

  var playBtnBorderMat = new THREE.MeshBasicMaterial({
    color: 0x88ffaa,
    transparent: true,
    opacity: 0.9,
    side: THREE.DoubleSide
  });
  var playBtnBorder = new THREE.Mesh(new THREE.PlaneGeometry(1.44, 0.54), playBtnBorderMat);
  playBtnBorder.position.z = -0.002;
  playBtnGroup.add(playBtnBorder);

  var playLabelCanvas = document.createElement('canvas');
  playLabelCanvas.width = 1024; playLabelCanvas.height = 256;
  var plctx = playLabelCanvas.getContext('2d');
  plctx.fillStyle = '#001a0a';
  plctx.font = 'bold 110px -apple-system, sans-serif';
  plctx.textAlign = 'center'; plctx.textBaseline = 'middle';
  plctx.fillText('▶  ИГРАТЬ', 512, 128);
  var playLabelMat = new THREE.MeshBasicMaterial({
    map: new THREE.CanvasTexture(playLabelCanvas), transparent: true
  });
  var playLabel = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.5), playLabelMat);
  playLabel.position.z = 0.005;
  playBtnGroup.add(playLabel);

  // Прогресс-кружок для наведения
  var holdProgress = 0;  // 0..1
  var playBtnHoldTime = 1.5; // секунд для срабатывания

  // Кнопка "Выход" (в игре вернуться в меню)
  var backBtnGroup = new THREE.Group();
  backBtnGroup.position.set(0, 1.0, -2.5);
  backBtnGroup.visible = false;
  gameScene.add(backBtnGroup);

  var backBtnMat = new THREE.MeshBasicMaterial({
    color: 0x442244, transparent: true, opacity: 0.9, side: THREE.DoubleSide
  });
  var backBtn = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.3), backBtnMat);
  backBtnGroup.add(backBtn);

  var backLabelCanvas = document.createElement('canvas');
  backLabelCanvas.width = 512; backLabelCanvas.height = 128;
  var blctx = backLabelCanvas.getContext('2d');
  blctx.fillStyle = '#ffffff';
  blctx.font = 'bold 60px -apple-system, sans-serif';
  blctx.textAlign = 'center'; blctx.textBaseline = 'middle';
  blctx.fillText('◀ МЕНЮ', 256, 64);
  var backLabelMat = new THREE.MeshBasicMaterial({
    map: new THREE.CanvasTexture(backLabelCanvas), transparent: true
  });
  var backLabel = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.3), backLabelMat);
  backLabel.position.z = 0.005;
  backBtnGroup.add(backLabel);

  // ================================================================
  // ИГРОВАЯ СЦЕНА — ОФИС
  // ================================================================

  // Пол
  var floorMat = new THREE.MeshStandardMaterial({ color: 0x4a4030, roughness: 0.9 });
  var floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0;
  gameScene.add(floor);

  // Стены
  var wallMat = new THREE.MeshStandardMaterial({ color: 0x6a5a4a, roughness: 1, side: THREE.DoubleSide });
  var backWall = new THREE.Mesh(new THREE.PlaneGeometry(20, 6), wallMat);
  backWall.position.set(0, 3, -8);
  gameScene.add(backWall);

  var leftWall = new THREE.Mesh(new THREE.PlaneGeometry(16, 6), wallMat);
  leftWall.position.set(-8, 3, 0);
  leftWall.rotation.y = Math.PI / 2;
  gameScene.add(leftWall);

  var rightWall = new THREE.Mesh(new THREE.PlaneGeometry(16, 6), wallMat);
  rightWall.position.set(8, 3, 0);
  rightWall.rotation.y = -Math.PI / 2;
  gameScene.add(rightWall);

  // ============ СТОЛ ============
  var deskGroup = new THREE.Group();
  deskGroup.position.set(0, 0, -1.5);
  gameScene.add(deskGroup);

  var woodMat = new THREE.MeshStandardMaterial({ color: 0x8b6a4a, roughness: 0.65 });
  var deskTop = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.1, 1.2), woodMat);
  deskTop.position.set(0, 0.85, 0);
  deskGroup.add(deskTop);

  var legMat = new THREE.MeshStandardMaterial({ color: 0x5a4530, roughness: 0.8 });
  var legPositions = [
    [-1.2, 0.4, -0.5], [1.2, 0.4, -0.5],
    [-1.2, 0.4,  0.5], [1.2, 0.4,  0.5]
  ];
  for (var li = 0; li < legPositions.length; li++) {
    var leg = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.8, 0.08), legMat);
    leg.position.set(legPositions[li][0], legPositions[li][1], legPositions[li][2]);
    deskGroup.add(leg);
  }

  // ============ ПРЕДМЕТЫ НА СТОЛЕ (Job Simulator стиль) ============
  var grabbables = [];  // предметы, которые можно брать

  // 1. Кружка
  var mugGroup = new THREE.Group();
  mugGroup.position.set(-0.8, 1.05, -1.5);
  var mugMat = new THREE.MeshStandardMaterial({ color: 0xff4444, roughness: 0.4 });
  var mugBody = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.18, 16), mugMat);
  mugGroup.add(mugBody);
  var handleMat = new THREE.MeshStandardMaterial({ color: 0xff4444, roughness: 0.4 });
  var handle = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.02, 8, 16), handleMat);
  handle.position.set(0.11, 0, 0);
  handle.rotation.y = Math.PI / 2;
  mugGroup.add(handle);
  gameScene.add(mugGroup);
  grabbables.push({ mesh: mugGroup, name: 'кружку', grabbed: false });

  // 2. Степлер (коробочка)
  var staplerGroup = new THREE.Group();
  staplerGroup.position.set(0.5, 1.02, -1.5);
  var staplerMat = new THREE.MeshStandardMaterial({ color: 0x2222aa, roughness: 0.4, metalness: 0.6 });
  var staplerBody = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.08, 0.1), staplerMat);
  staplerGroup.add(staplerBody);
  var staplerTop = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.06, 0.08), staplerMat);
  staplerTop.position.set(0, 0.06, 0);
  staplerGroup.add(staplerTop);
  gameScene.add(staplerGroup);
  grabbables.push({ mesh: staplerGroup, name: 'степлер', grabbed: false });

  // 3. Яблоко
  var appleGeo = new THREE.SphereGeometry(0.1, 16, 16);
  var appleMat = new THREE.MeshStandardMaterial({ color: 0xcc3322, roughness: 0.5 });
  var apple = new THREE.Mesh(appleGeo, appleMat);
  apple.position.set(-0.2, 1.1, -1.5);
  var appleStem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.01, 0.01, 0.05, 6),
    new THREE.MeshStandardMaterial({ color: 0x4a3a20 })
  );
  appleStem.position.set(0, 0.11, 0);
  apple.add(appleStem);
  gameScene.add(apple);
  grabbables.push({ mesh: apple, name: 'яблоко', grabbed: false });

  // 4. Телефон
  var phoneGroup = new THREE.Group();
  phoneGroup.position.set(0.9, 1.02, -1.3);
  var phoneBodyMat = new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.3, metalness: 0.5 });
  var phoneBody = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.015), phoneBodyMat);
  phoneGroup.add(phoneBody);
  var phoneScreenMat = new THREE.MeshBasicMaterial({ color: 0x44ffaa });
  var phoneScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.085, 0.17), phoneScreenMat);
  phoneScreen.position.z = 0.009;
  phoneGroup.add(phoneScreen);
  phoneGroup.rotation.z = 0.3;
  gameScene.add(phoneGroup);
  grabbables.push({ mesh: phoneGroup, name: 'телефон', grabbed: false });

  // 5. Бумаги (стопка)
  var papersGroup = new THREE.Group();
  papersGroup.position.set(-0.6, 0.92, -1.2);
  for (var pp = 0; pp < 4; pp++) {
    var paper = new THREE.Mesh(
      new THREE.PlaneGeometry(0.2, 0.28),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, side: THREE.DoubleSide })
    );
    paper.rotation.x = -Math.PI / 2;
    paper.position.y = pp * 0.005;
    papersGroup.add(paper);
  }
  gameScene.add(papersGroup);
  grabbables.push({ mesh: papersGroup, name: 'бумаги', grabbed: false });

  // ============ МУСОРКА ============
  var trashGroup = new THREE.Group();
  trashGroup.position.set(1.6, 0, -2);
  var trashMat = new THREE.MeshStandardMaterial({ color: 0x3366aa, roughness: 0.7 });
  var trashBody = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.2, 0.7, 16), trashMat);
  trashBody.position.y = 0.35;
  trashGroup.add(trashBody);
  // Отверстие
  var trashHoleMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
  var trashHole = new THREE.Mesh(new THREE.CircleGeometry(0.2, 16), trashHoleMat);
  trashHole.rotation.x = -Math.PI / 2;
  trashHole.position.y = 0.71;
  trashGroup.add(trashHole);
  gameScene.add(trashGroup);

  // ============ РОБОТ-НАСТАВНИК ============
  var robotGroup = new THREE.Group();
  robotGroup.position.set(0, 1.3, -3.2);
  gameScene.add(robotGroup);

  // Голова
  var robotHeadMat = new THREE.MeshStandardMaterial({ color: 0xccccdd, roughness: 0.3, metalness: 0.6 });
  var robotHead = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.4), robotHeadMat);
  robotGroup.add(robotHead);

  // Глаза
  var eyeMat = new THREE.MeshBasicMaterial({ color: 0x44ffff });
  var eyeL = new THREE.Mesh(new THREE.CircleGeometry(0.06, 16), eyeMat);
  eyeL.position.set(-0.12, 0.05, 0.21);
  robotGroup.add(eyeL);
  var eyeR = new THREE.Mesh(new THREE.CircleGeometry(0.06, 16), eyeMat);
  eyeR.position.set(0.12, 0.05, 0.21);
  robotGroup.add(eyeR);

  // Тело
  var robotBody = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.35), robotHeadMat);
  robotBody.position.y = -0.65;
  robotGroup.add(robotBody);

  // Индикатор на груди
  var chestMat = new THREE.MeshBasicMaterial({ color: 0xff44aa });
  var chestLight = new THREE.Mesh(new THREE.CircleGeometry(0.08, 16), chestMat);
  chestLight.position.set(0, -0.55, 0.18);
  robotGroup.add(chestLight);

  // ============ ПАНЕЛЬ ЗАДАНИЙ ============
  var taskPanelGroup = new THREE.Group();
  taskPanelGroup.position.set(0, 2.4, -3.0);
  gameScene.add(taskPanelGroup);

  var taskBgMat = new THREE.MeshBasicMaterial({
    color: 0x0a1420, transparent: true, opacity: 0.9, side: THREE.DoubleSide
  });
  var taskBg = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 0.55), taskBgMat);
  taskPanelGroup.add(taskBg);

  var taskBorderMat = new THREE.MeshBasicMaterial({
    color: 0x44ffff, transparent: true, opacity: 0.7, side: THREE.DoubleSide
  });
  var taskBorder = new THREE.Mesh(new THREE.PlaneGeometry(2.04, 0.59), taskBorderMat);
  taskBorder.position.z = -0.001;
  taskPanelGroup.add(taskBorder);

  var taskTextCanvas = document.createElement('canvas');
  taskTextCanvas.width = 1024; taskTextCanvas.height = 256;
  var taskTextCtx = taskTextCanvas.getContext('2d');
  function updateTaskText(text) {
    taskTextCtx.clearRect(0, 0, 1024, 256);
    taskTextCtx.fillStyle = '#44ffff';
    taskTextCtx.font = 'bold 40px -apple-system, sans-serif';
    taskTextCtx.textAlign = 'center';
    taskTextCtx.textBaseline = 'middle';
    taskTextCtx.fillText('ЗАДАНИЕ:', 512, 60);
    taskTextCtx.fillStyle = '#ffffff';
    taskTextCtx.font = 'bold 62px -apple-system, sans-serif';
    taskTextCtx.fillText(text, 512, 160);
    taskTexture.needsUpdate = true;
  }
  var taskTexture = new THREE.CanvasTexture(taskTextCanvas);
  var taskTextMat = new THREE.MeshBasicMaterial({
    map: taskTexture, transparent: true
  });
  var taskTextMesh = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 0.55), taskTextMat);
  taskTextMesh.position.z = 0.005;
  taskPanelGroup.add(taskTextMesh);

  // ============ ИГРОВАЯ ЛОГИКА ============
  var tasks = [
    { text: 'Возьми кружку', target: 'кружку', done: false },
    { text: 'Брось яблоко в мусорку', target: 'яблоко', done: false },
    { text: 'Урони степлер на пол', target: 'степлер', done: false },
    { text: 'Возьми телефон', target: 'телефон', done: false }
  ];
  var currentTask = 0;
  var tasksCompleted = 0;

  function nextTask() {
    currentTask++;
    if (currentTask >= tasks.length) {
      updateTaskText('ВСЁ СДЕЛАНО! 🎉');
      setTimeout(function() {
        showToast('Отличная работа! Возвращайся в меню', 4000);
      }, 500);
    } else {
      updateTaskText(tasks[currentTask].text);
    }
  }
  updateTaskText(tasks[0].text);

  // ================ СВАЙП ================
  var SWIPE_SENS = 0.005;
  var targetYaw = 0, targetPitch = 0;
  var currentYaw = 0, currentPitch = 0;

  var isTouching = false;
  var lastTouchX = 0, lastTouchY = 0;
  var touchId = null;

  touchLayer.addEventListener('touchstart', function(e) {
    if (e.touches.length === 0) return;
    var t = e.touches[0];
    isTouching = true;
    touchId = t.identifier;
    lastTouchX = t.clientX;
    lastTouchY = t.clientY;
    e.preventDefault();
  }, { passive: false });

  touchLayer.addEventListener('touchmove', function(e) {
    if (!isTouching) return;
    for (var i = 0; i < e.touches.length; i++) {
      var t = e.touches[i];
      if (t.identifier === touchId) {
        var dx = t.clientX - lastTouchX;
        var dy = t.clientY - lastTouchY;
        lastTouchX = t.clientX;
        lastTouchY = t.clientY;
        targetYaw   -= dx * SWIPE_SENS;
        targetPitch -= dy * SWIPE_SENS;
        if (targetPitch >  Math.PI / 3) targetPitch =  Math.PI / 3;
        if (targetPitch < -Math.PI / 3) targetPitch = -Math.PI / 3;
        break;
      }
    }
    e.preventDefault();
  }, { passive: false });

  function endTouch(e) {
    isTouching = false;
    touchId = null;
    if (e) e.preventDefault();
  }
  touchLayer.addEventListener('touchend', endTouch, { passive: false });
  touchLayer.addEventListener('touchcancel', endTouch, { passive: false });

  // Мышь для десктопа
  var mouseDown = false;
  touchLayer.addEventListener('mousedown', function(e) {
    mouseDown = true;
    lastTouchX = e.clientX;
    lastTouchY = e.clientY;
  });
  touchLayer.addEventListener('mousemove', function(e) {
    if (!mouseDown) return;
    var dx = e.clientX - lastTouchX;
    var dy = e.clientY - lastTouchY;
    lastTouchX = e.clientX;
    lastTouchY = e.clientY;
    targetYaw   -= dx * SWIPE_SENS;
    targetPitch -= dy * SWIPE_SENS;
    if (targetPitch >  Math.PI / 3) targetPitch =  Math.PI / 3;
    if (targetPitch < -Math.PI / 3) targetPitch = -Math.PI / 3;
  });
  touchLayer.addEventListener('mouseup', function() { mouseDown = false; });
  touchLayer.addEventListener('mouseleave', function() { mouseDown = false; });

  // ================ FULLSCREEN ================
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var isStandalone = window.navigator.standalone === true ||
                     window.matchMedia('(display-mode: standalone)').matches;

  function goFullscreen() {
    var el = document.documentElement;
    if (isIOS) {
      if (isStandalone) showToast('Уже в полноэкранном режиме ✓', 2000);
      else showToast('iPhone: Поделиться → На экран «Домой» для полного экрана', 5000);
      return;
    }
    if (el.requestFullscreen) {
      if (!document.fullscreenElement) {
        el.requestFullscreen().catch(function(){});
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(function(){});
        }
      } else {
        document.exitFullscreen().catch(function(){});
      }
    }
  }
  var fsBtnPressed = false;
  function handleFsPress(e) {
    if (e) { e.stopPropagation(); e.preventDefault(); }
    if (fsBtnPressed) return;
    fsBtnPressed = true;
    setTimeout(function() { fsBtnPressed = false; }, 300);
    goFullscreen();
  }
  fsBtn.addEventListener('click', handleFsPress);
  fsBtn.addEventListener('touchend', handleFsPress, { passive: false });

  // ================ MEDIAPIPE ================
  var handsReady = false;
  var handData = [];
  var handsInstance = null;
  var mpRunning = false;

  var videoEl = document.createElement('video');
  videoEl.setAttribute('playsinline', '');
  videoEl.muted = true;
  videoEl.style.display = 'none';
  document.body.appendChild(videoEl);

  function initHands() {
    if (handsInstance) return;
    if (typeof Hands === 'undefined') {
      mpStatus.textContent = '⚠️ MediaPipe не загрузился';
      return;
    }
    try {
      handsInstance = new Hands({
        locateFile: function(f) {
          return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + f;
        }
      });
      handsInstance.setOptions({
        maxNumHands: 2,
        modelComplexity: 0,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5,
        selfieMode: true
      });
      handsInstance.onResults(function(results) {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length) {
          handData = results.multiHandLandmarks.map(function(lm) {
            var ids = [0, 5, 9, 13, 17];
            var x = 0, y = 0;
            for (var i = 0; i < ids.length; i++) { x += lm[ids[i]].x; y += lm[ids[i]].y; }
            return { x: x / ids.length, y: y / ids.length, landmarks: lm };
          });
        } else {
          handData = [];
        }
      });
      trackModelDownload();
      handsInstance.initialize().then(function() {
        handsReady = true;
        mpFill.style.width = '100%';
        mpPct.textContent = '100%';
        mpStatus.textContent = 'Готово ✓';
        setTimeout(function() { mpBar.classList.add('hidden'); }, 800);
        startMpLoop();
      }).catch(function(err) {
        console.error('MP init error', err);
        mpStatus.textContent = '⚠️ Ошибка загрузки';
      });
    } catch (e) { console.error(e); }
  }

  function trackModelDownload() {
    var urls = [
      'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands_solution_packed_assets_loader.js',
      'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands_solution_simd_wasm_bin.wasm',
      'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.binarypb'
    ];
    var loadedPerFile = [0, 0, 0];
    var sizePerFile = [50000, 5000000, 500000];

    function updateBar() {
      var total = 0, loaded = 0;
      for (var i = 0; i < urls.length; i++) {
        total += sizePerFile[i];
        loaded += Math.min(loadedPerFile[i], sizePerFile[i]);
      }
      var pct = Math.min(99, Math.round((loaded / total) * 100));
      mpFill.style.width = pct + '%';
      mpPct.textContent = pct + '%';
    }

    urls.forEach(function(url, idx) {
      fetch(url).then(function(response) {
        var size = parseInt(response.headers.get('content-length')) || sizePerFile[idx];
        sizePerFile[idx] = size;
        var reader = response.body.getReader();
        function read() {
          return reader.read().then(function(result) {
            if (result.done) return;
            loadedPerFile[idx] += result.value.length;
            updateBar();
            return read();
          });
        }
        return read();
      }).catch(function() {});
    });
  }

  function startMpLoop() {
    if (mpRunning) return;
    mpRunning = true;
    function loop() {
      if (!mpRunning) return;
      if (handsReady && videoEl.readyState >= 2) {
        handsInstance.send({ image: videoEl }).catch(function(){});
      }
      requestAnimationFrame(loop);
    }
    loop();
  }

  // ================ РУКИ ================
  var CONNECTIONS = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],
    [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],
    [0,17],[0,5]
  ];
  var HAND_COLORS = ['#00ffff', '#ff44aa'];

  function drawHands() {
    handCtx.clearRect(0, 0, canvasHand.width, canvasHand.height);
    if (!handData.length) return;
    var W = canvasHand.width, H = canvasHand.height;

    for (var hi = 0; hi < handData.length; hi++) {
      var lm = handData[hi].landmarks;
      var color = HAND_COLORS[hi % HAND_COLORS.length];
      // БЕЗ зеркалирования — MediaPipe уже отдал правильные координаты
      function px(l) { return l.x * W; }
      function py(l) { return l.y * H; }

      handCtx.strokeStyle = color;
      handCtx.lineWidth = 4;
      handCtx.lineCap = 'round';
      handCtx.lineJoin = 'round';
      handCtx.shadowColor = color;
      handCtx.shadowBlur = 12;

      for (var ci = 0; ci < CONNECTIONS.length; ci++) {
        var a = lm[CONNECTIONS[ci][0]];
        var b = lm[CONNECTIONS[ci][1]];
        handCtx.beginPath();
        handCtx.moveTo(px(a), py(a));
        handCtx.lineTo(px(b), py(b));
        handCtx.stroke();
      }

      handCtx.shadowBlur = 8;
      handCtx.fillStyle = color;
      for (var ji = 0; ji < lm.length; ji++) {
        var j = lm[ji];
        handCtx.beginPath();
        handCtx.arc(px(j), py(j), 4, 0, Math.PI * 2);
        handCtx.fill();
      }

      handCtx.shadowBlur = 15;
      var tips = [4, 8, 12, 16, 20];
      for (var ti = 0; ti < tips.length; ti++) {
        var tp = lm[tips[ti]];
        handCtx.fillStyle = '#ffffff';
        handCtx.beginPath();
        handCtx.arc(px(tp), py(tp), 6, 0, Math.PI * 2);
        handCtx.fill();
        handCtx.strokeStyle = color;
        handCtx.lineWidth = 2;
        handCtx.stroke();
      }
      handCtx.shadowBlur = 0;
    }
  }

  // ================ РУКА В МИРЕ ================
  // Преобразуем экранную позицию руки в луч → точка на дистанции HAND_DIST
  var HAND_DIST = 1.8;  // на каком расстоянии от камеры "виртуальная рука"
  function getHandWorldPos(h) {
    var ndcX = h.x * 2 - 1;
    var ndcY = -(h.y * 2 - 1);
    var vec = new THREE.Vector3(ndcX, ndcY, 0.5).unproject(camera);
    var dir = vec.sub(camera.position).normalize();
    return camera.position.clone().add(dir.multiplyScalar(HAND_DIST));
  }

  // ================ РЕЖИМ ================
  var mode = 'menu';  // 'menu' | 'game'
  var running = false;

  // ================ КНОПКА "ИГРАТЬ" ================
  function updatePlayButton() {
    if (mode !== 'menu') { playBtnMat.opacity = 0.85; return; }

    // Проверяем, наведена ли рука на кнопку
    var hovering = false;
    if (handData.length > 0) {
      var handPos = getHandWorldPos(handData[0]);
      // Мировая позиция кнопки
      var btnWorld = new THREE.Vector3();
      playBtnGroup.getWorldPosition(btnWorld);
      var dist = handPos.distanceTo(btnWorld);
      if (dist < 0.45) hovering = true;
    }

    if (hovering) {
      holdProgress += 0.016 / playBtnHoldTime;
      if (holdProgress >= 1) {
        holdProgress = 1;
        // Сработала!
        enterGame();
        return;
      }
      playBtnMat.opacity = 0.6 + holdProgress * 0.4;
      playBtnMat.color.setHex(0x88ffaa);
    } else {
      holdProgress = Math.max(0, holdProgress - 0.03);
      playBtnMat.opacity = 0.85;
      playBtnMat.color.setHex(0x44ff88);
    }
    playLabelMat.opacity = 1;
  }

  function enterGame() {
    mode = 'game';
    menuScene.visible = false;
    gameScene.visible = true;
    backBtnGroup.visible = true;
    holdProgress = 0;
    showToast('🎮 Добро пожаловать на работу!', 2500);
    playBtnMat.opacity = 0.85;
    playBtnMat.color.setHex(0x44ff88);
  }

  function exitToMenu() {
    mode = 'menu';
    menuScene.visible = true;
    gameScene.visible = false;
    backBtnGroup.visible = false;
    holdProgress = 0;
    // Сброс заданий
    currentTask = 0;
    tasksCompleted = 0;
    for (var i = 0; i < grabbables.length; i++) grabbables[i].grabbed = false;
    updateTaskText(tasks[0].text);
    // Возврат предметов на исходные позиции (упрощённо — просто покажем заново)
    showToast('Возврат в меню', 1500);
  }

  // ================ ХВАТАНИЕ ПРЕДМЕТОВ ================
  // Упрощённо: если рука рядом с предметом — предмет "прилипает" к руке.
  // Отпускание — рука далеко (> 0.5 м) — предмет падает.
  var heldBy = new Map();  // mesh → handIndex

  function updateGrab() {
    if (mode !== 'game') return;
    if (!handData.length) {
      // Нет рук — все предметы отпущены
      heldBy.clear();
      return;
    }

    // Мировые позиции рук
    var handWorlds = handData.map(function(h) { return getHandWorldPos(h); });

    for (var gi = 0; gi < grabbables.length; gi++) {
      var item = grabbables[gi];
      var mesh = item.mesh;

      // Уже держится?
      var holderIdx = -1;
      heldBy.forEach(function(v, k) {
        if (k === mesh) holderIdx = v;
      });

      if (holderIdx >= 0 && holderIdx < handWorlds.length) {
        // Двигаем за рукой
        var target = handWorlds[holderIdx].clone();
        mesh.position.lerp(target, 0.3);
        // Проверка отпускания — если рука далеко (> 0.6 м), отпускаем
        if (mesh.position.distanceTo(target) > 0.6) {
          heldBy.delete(mesh);
        }
        continue;
      }

      // Не держится — проверяем, хочет ли рука схватить
      for (var hi = 0; hi < handWorlds.length; hi++) {
        var hw = handWorlds[hi];
        var d = mesh.position.distanceTo(hw);
        if (d < 0.25) {
          // Уже что-то другое в этой руке?
          var busy = false;
          heldBy.forEach(function(v) { if (v === hi) busy = true; });
          if (busy) continue;
          heldBy.set(mesh, hi);
          break;
        }
      }
    }

    // Проверка выполнения заданий
    if (currentTask < tasks.length) {
      var task = tasks[currentTask];
      if (!task.done) {
        if (task.target === 'яблоко') {
          // Яблоко в мусорке?
          var appleItem = null;
          for (var ai = 0; ai < grabbables.length; ai++) {
            if (grabbables[ai].name === 'яблоко') { appleItem = grabbables[ai]; break; }
          }
          if (appleItem) {
            var trashWorld = new THREE.Vector3();
            trashGroup.getWorldPosition(trashWorld);
            trashWorld.y += 0.4;
            if (appleItem.mesh.position.distanceTo(trashWorld) < 0.5) {
              task.done = true;
              tasksCompleted++;
              showToast('✅ ' + task.text, 1500);
              setTimeout(nextTask, 800);
            }
          }
        } else if (task.target === 'степлер') {
          // Степлер упал на пол?
          for (var si = 0; si < grabbables.length; si++) {
            if (grabbables[si].name === 'степлер') {
              if (grabbables[si].mesh.position.y < 0.3 && !heldBy.has(grabbables[si].mesh)) {
                task.done = true;
                tasksCompleted++;
                showToast('✅ ' + task.text, 1500);
                setTimeout(nextTask, 800);
              }
              break;
            }
          }
        } else {
          // Просто "взять предмет" — если он в руке
          for (var ti = 0; ti < grabbables.length; ti++) {
            if (grabbables[ti].name === task.target && heldBy.has(grabbables[ti].mesh)) {
              task.done = true;
              tasksCompleted++;
              showToast('✅ ' + task.text, 1500);
              setTimeout(nextTask, 800);
              break;
            }
          }
        }
      }
    }
  }

  // ================ ФИЗИКА ГРАВИТАЦИИ ================
  // Простая: если предмет не в руке и не на столе, падает
  function updateGravity(dt) {
    if (mode !== 'game') return;
    for (var i = 0; i < grabbables.length; i++) {
      var mesh = grabbables[i].mesh;
      if (heldBy.has(mesh)) continue;
      // Если выше пола — падает
      var groundY = (mesh === mugGroup || mesh === staplerGroup || mesh === apple || mesh === phoneGroup || mesh === papersGroup) ? 1.05 : 0.15;
      // Очень упрощённо: если y > 0.15 (пол), падает
      if (mesh.position.y > 0.15) {
        mesh.position.y -= dt * 2;
        if (mesh.position.y < 0.15) mesh.position.y = 0.15;
      }
    }
  }

  // ================ АНИМАЦИЯ ================
  var lastT = performance.now() / 1000;
  var handDrawAccum = 0;
  var HAND_DRAW_INTERVAL = 1/30;

  function animate() {
    requestAnimationFrame(animate);

    var now = performance.now() / 1000;
    var dt = now - lastT;
    lastT = now;
    if (dt > 0.1) dt = 0.1;
    if (dt < 0) dt = 0;

    // Свайп → поворот камеры
    currentYaw   += (targetYaw   - currentYaw)   * Math.min(1, dt * 12);
    currentPitch += (targetPitch - currentPitch) * Math.min(1, dt * 12);
    camera.rotation.y = currentYaw;
    camera.rotation.x = currentPitch;
    camera.rotation.z = 0;

    // Панорама следует за камерой
    pano.position.copy(camera.position);

    if (running) {
      updatePlayButton();
      updateGrab();
      updateGravity(dt);
    }

    handDrawAccum += dt;
    if (handDrawAccum >= HAND_DRAW_INTERVAL) {
      handDrawAccum = 0;
      drawHands();
    }

    renderer.render(scene, camera);
  }

  // ================ РАЗМЕРЫ ================
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    canvasHand.width = w;
    canvasHand.height = h;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function() { setTimeout(resize, 200); });
  resize();

  // ================ СТАРТ ================
  startBtn.addEventListener('click', function() {
    startBtn.disabled = true;
    startBtn.textContent = 'Запуск...';
    statusEl.textContent = 'Запускаем камеру...';

    goFullscreen();

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      startBtn.disabled = false;
      startBtn.textContent = '❌ Нет камеры';
      return;
    }

    navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: 'user',
        width: { ideal: 640 },
        height: { ideal: 480 }
      }
    }).then(function(stream) {
      videoEl.srcObject = stream;
      return videoEl.play();
    }).then(function() {
      startBtn.classList.add('hidden');
      running = true;
      lastT = performance.now() / 1000;

      mpBar.classList.remove('hidden');
      mpStatus.textContent = 'Загрузка рук...';
      mpFill.style.width = '0%';
      mpPct.textContent = '0%';

      statusEl.textContent = 'Наведи руку на кнопку "ИГРАТЬ" и подержи';
      initHands();
    }).catch(function(err) {
      console.error(err);
      startBtn.disabled = false;
      startBtn.textContent = '❌ Повторить';
      statusEl.textContent = '❌ Камера: ' + (err.name || err.message || 'ошибка');
    });
  });

  animate();
})();
</script>
</body>
