<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>VR Cube Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
    position: fixed;
  }
  #three-canvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
    display: block;
  }
  #hand-canvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 2;
    pointer-events: none;
  }
  #touch-layer {
    position: fixed; inset: 0;
    z-index: 5;
    touch-action: none;
  }
  #hud {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: 50%; transform: translateX(-50%);
    z-index: 100;
    display: flex; gap: 10px;
    font-weight: 800; color: #fff;
    text-shadow: 0 0 12px rgba(0,0,0,0.9);
    font-size: 14px;
  }
  .pill {
    background: rgba(0,0,0,0.5);
    padding: 6px 14px; border-radius: 30px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
  }
  #score { color: #44ffaa; }
  #combo { color: #ffdd00; }

  #fs-btn {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    z-index: 150;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #fs-btn:active { transform: scale(0.9); background: rgba(100,150,255,0.5); }

  #mp-bar {
    position: fixed;
    top: max(52px, calc(env(safe-area-inset-top) + 40px));
    left: 50%; transform: translateX(-50%);
    z-index: 100;
    width: min(320px, 70vw);
    background: rgba(0,0,0,0.6);
    border-radius: 20px;
    padding: 8px 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    transition: opacity 0.4s, transform 0.4s;
  }
  #mp-bar.hidden {
    opacity: 0;
    transform: translate(-50%, -20px);
    pointer-events: none;
  }
  #mp-label {
    color: #fff; font-size: 11px; font-weight: 600;
    margin-bottom: 5px;
    display: flex; justify-content: space-between; align-items: center;
  }
  #mp-label .status-txt { color: #88aaff; }
  #mp-label .pct { color: #44ffaa; font-variant-numeric: tabular-nums; }
  #mp-track {
    width: 100%; height: 5px;
    background: rgba(255,255,255,0.15);
    border-radius: 4px; overflow: hidden;
  }
  #mp-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4488ff, #aa44ff, #ff44aa);
    border-radius: 4px;
    transition: width 0.2s;
    box-shadow: 0 0 8px rgba(170,68,255,0.7);
  }

  #start-btn {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 200;
    padding: 20px 42px;
    font-size: 20px; font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, #ff3366, #aa44ff);
    border: none; border-radius: 60px;
    box-shadow: 0 10px 40px rgba(170,68,255,0.6);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    letter-spacing: 1px;
    font-family: inherit;
  }
  #start-btn:active { transform: translate(-50%, -50%) scale(0.95); }
  #start-btn.hidden { display: none; }

  #status {
    position: fixed;
    bottom: max(12px, env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 12px;
    background: rgba(0,0,0,0.6);
    padding: 6px 14px; border-radius: 20px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 100;
    max-width: 90vw; text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity 0.3s;
  }

  /* Тост для подсказки о fullscreen на iOS */
  #toast {
    position: fixed;
    bottom: max(60px, calc(env(safe-area-inset-bottom) + 50px));
    left: 50%; transform: translateX(-50%) translateY(20px);
    z-index: 300;
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 12px 20px;
    border-radius: 16px;
    font-size: 13px;
    max-width: 85vw;
    text-align: center;
    line-height: 1.4;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<canvas id="three-canvas"></canvas>
<canvas id="hand-canvas"></canvas>
<div id="touch-layer"></div>

<div id="hud">
  <div class="pill">Очки: <span id="score">0</span></div>
  <div class="pill">Комбо: <span id="combo">x1</span></div>
</div>

<button id="fs-btn" title="На весь экран">⛶</button>

<div id="mp-bar" class="hidden">
  <div id="mp-label">
    <span class="status-txt" id="mp-status">Загрузка рук...</span>
    <span class="pct" id="mp-pct">0%</span>
  </div>
  <div id="mp-track"><div id="mp-fill"></div></div>
</div>

<div id="toast"></div>

<div id="status">Нажми «Старт» чтобы войти</div>
<button id="start-btn">▶ ВОЙТИ В VR</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function() {
  'use strict';

  var canvas3d   = document.getElementById('three-canvas');
  var canvasHand = document.getElementById('hand-canvas');
  var handCtx    = canvasHand.getContext('2d');
  var touchLayer = document.getElementById('touch-layer');
  var startBtn   = document.getElementById('start-btn');
  var fsBtn      = document.getElementById('fs-btn');
  var statusEl   = document.getElementById('status');
  var scoreEl    = document.getElementById('score');
  var comboEl    = document.getElementById('combo');
  var mpBar      = document.getElementById('mp-bar');
  var mpFill     = document.getElementById('mp-fill');
  var mpPct      = document.getElementById('mp-pct');
  var mpStatus   = document.getElementById('mp-status');
  var toastEl    = document.getElementById('toast');

  if (typeof THREE === 'undefined') {
    statusEl.textContent = '❌ Three.js не загрузился';
    return;
  }

  // ================ ТОСТ ================
  var toastTimer = null;
  function showToast(text, duration) {
    duration = duration || 3000;
    toastEl.textContent = text;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      toastEl.classList.remove('show');
    }, duration);
  }

  // ================ THREE.JS ================
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1.6, 0);
  camera.rotation.order = 'YXZ';

  var renderer = new THREE.WebGLRenderer({
    canvas: canvas3d,
    antialias: true,
    powerPreference: 'high-performance'
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x1a1525, 1);

  // ================ ПАНОРАМА ================
  var panoGeo = new THREE.SphereGeometry(500, 60, 40);
  panoGeo.scale(-1, 1, 1);
  var panoMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  var pano = new THREE.Mesh(panoGeo, panoMat);
  scene.add(pano);

  var gradCanvas = document.createElement('canvas');
  gradCanvas.width = 1024; gradCanvas.height = 512;
  var gctx = gradCanvas.getContext('2d');
  var grad = gctx.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0.0, '#1a1a4e');
  grad.addColorStop(0.4, '#6a3a8a');
  grad.addColorStop(0.6, '#ff6a5a');
  grad.addColorStop(0.8, '#ffae5a');
  grad.addColorStop(1.0, '#3a2050');
  gctx.fillStyle = grad;
  gctx.fillRect(0, 0, 1024, 512);
  for (var i = 0; i < 250; i++) {
    gctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.7) + ')';
    gctx.fillRect(Math.random() * 1024, Math.random() * 220, 2, 2);
  }
  var sunGrad = gctx.createRadialGradient(512, 380, 0, 512, 380, 150);
  sunGrad.addColorStop(0, 'rgba(255,240,180,1)');
  sunGrad.addColorStop(0.4, 'rgba(255,180,100,0.6)');
  sunGrad.addColorStop(1, 'rgba(255,120,80,0)');
  gctx.fillStyle = sunGrad;
  gctx.fillRect(300, 250, 424, 260);
  var gradientTex = new THREE.CanvasTexture(gradCanvas);
  gradientTex.mapping = THREE.EquirectangularReflectionMapping;
  panoMat.map = gradientTex;
  panoMat.needsUpdate = true;

  var texLoader = new THREE.TextureLoader();
  texLoader.crossOrigin = 'anonymous';
  texLoader.load(
    'https://threejs.org/examples/textures/2294472375_24a3b8ef46_o.jpg',
    function(tex) {
      tex.mapping = THREE.EquirectangularReflectionMapping;
      panoMat.map = tex;
      panoMat.needsUpdate = true;
    },
    undefined,
    function() {}
  );

  // ================ МЕНЮ-ПАНЕЛЬ ================
  var menuGroup = new THREE.Group();
  menuGroup.position.set(0, 1.5, -2.5);
  scene.add(menuGroup);

  var menuBgMat = new THREE.MeshBasicMaterial({
    color: 0x0a0a14, transparent: true, opacity: 0.92, side: THREE.DoubleSide
  });
  menuGroup.add(new THREE.Mesh(new THREE.PlaneGeometry(2.2, 1.4), menuBgMat));

  var borderMat = new THREE.MeshBasicMaterial({
    color: 0x4488ff, transparent: true, opacity: 0.6, side: THREE.DoubleSide
  });
  var border = new THREE.Mesh(new THREE.PlaneGeometry(2.24, 1.44), borderMat);
  border.position.z = -0.001;
  menuGroup.add(border);

  var titleCanvas = document.createElement('canvas');
  titleCanvas.width = 1024; titleCanvas.height = 256;
  var tctx = titleCanvas.getContext('2d');
  tctx.fillStyle = '#ffffff';
  tctx.font = 'bold 80px -apple-system, sans-serif';
  tctx.textAlign = 'center'; tctx.textBaseline = 'middle';
  tctx.fillText('WELCOME BACK', 512, 90);
  tctx.font = '48px -apple-system, sans-serif';
  tctx.fillStyle = '#88aaff';
  tctx.fillText('CUBE RUNNER VR', 512, 180);
  var titleMat = new THREE.MeshBasicMaterial({
    map: new THREE.CanvasTexture(titleCanvas), transparent: true
  });
  var titleMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.9, 0.48), titleMat);
  titleMesh.position.set(0, 0.42, 0.01);
  menuGroup.add(titleMesh);

  var tileColors = [0xff3366, 0x33aaff, 0xaa44ff];
  var tileLabels = ['EXPLORE', 'PLAY', 'SOCIAL'];
  for (var t = 0; t < 3; t++) {
    var tileMat = new THREE.MeshBasicMaterial({
      color: tileColors[t], transparent: true, opacity: 0.85, side: THREE.DoubleSide
    });
    var tile = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.55), tileMat);
    tile.position.set(-0.66 + t * 0.66, -0.18, 0.01);
    menuGroup.add(tile);

    var lblC = document.createElement('canvas');
    lblC.width = 512; lblC.height = 512;
    var lctx = lblC.getContext('2d');
    lctx.fillStyle = '#ffffff';
    lctx.font = 'bold 60px -apple-system, sans-serif';
    lctx.textAlign = 'center'; lctx.textBaseline = 'middle';
    lctx.fillText(tileLabels[t], 256, 256);
    var lblMat = new THREE.MeshBasicMaterial({
      map: new THREE.CanvasTexture(lblC), transparent: true
    });
    var lblMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.55), lblMat);
    lblMesh.position.set(-0.66 + t * 0.66, -0.18, 0.02);
    menuGroup.add(lblMesh);
  }

  // ================ СВЕТ ================
  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  var dl = new THREE.DirectionalLight(0xffffff, 1.0);
  dl.position.set(2, 5, 3);
  scene.add(dl);
  var pl1 = new THREE.PointLight(0xff44aa, 1.0, 20); pl1.position.set(3, 2, -3); scene.add(pl1);
  var pl2 = new THREE.PointLight(0x44aaff, 1.0, 20); pl2.position.set(-3, 2, -3); scene.add(pl2);

  // ================ КУБЫ ================
  var CUBE_COLORS = [0xff3366, 0x33ff99, 0x33aaff, 0xffaa33, 0xaa44ff, 0xff44aa, 0x44ffaa, 0xff6633];
  var cubes = [];
  var CUBE_POOL = 30;
  var cubeGeo = new THREE.BoxGeometry(0.35, 0.35, 0.35);

  for (var ci = 0; ci < CUBE_POOL; ci++) {
    var cColor = CUBE_COLORS[ci % CUBE_COLORS.length];
    var cMat = new THREE.MeshStandardMaterial({
      color: cColor, emissive: cColor, emissiveIntensity: 0.5,
      roughness: 0.3, metalness: 0.2
    });
    var cube = new THREE.Mesh(cubeGeo, cMat);
    cube.visible = false;
    cube.userData = { active: false, speed: 0, color: cColor, rotSpeed: new THREE.Vector3() };
    scene.add(cube);
    cubes.push(cube);
  }

  // ================ ЧАСТИЦЫ ================
  var PARTICLE_COUNT = 150;
  var particleGeo = new THREE.BufferGeometry();
  var pPos = new Float32Array(PARTICLE_COUNT * 3);
  var pVel = new Float32Array(PARTICLE_COUNT * 3);
  var pLife = new Float32Array(PARTICLE_COUNT);
  var pCol = new Float32Array(PARTICLE_COUNT * 3);
  particleGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  particleGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
  var particles = new THREE.Points(particleGeo, new THREE.PointsMaterial({
    size: 0.08, vertexColors: true, transparent: true, opacity: 0.95, depthWrite: false
  }));
  particles.frustumCulled = false;
  scene.add(particles);
  var pIdx = 0;
  for (var pi = 0; pi < PARTICLE_COUNT; pi++) pLife[pi] = 0;

  function spawnParticles(pos, color, count) {
    count = count || 14;
    var c = new THREE.Color(color);
    for (var i = 0; i < count; i++) {
      var k = pIdx; pIdx = (pIdx + 1) % PARTICLE_COUNT;
      pPos[k*3] = pos.x; pPos[k*3+1] = pos.y; pPos[k*3+2] = pos.z;
      pVel[k*3]   = (Math.random() - 0.5) * 3;
      pVel[k*3+1] = (Math.random() - 0.5) * 3;
      pVel[k*3+2] = (Math.random() - 0.5) * 3;
      pCol[k*3] = c.r; pCol[k*3+1] = c.g; pCol[k*3+2] = c.b;
      pLife[k] = 1.0;
    }
    particleGeo.attributes.position.needsUpdate = true;
    particleGeo.attributes.color.needsUpdate = true;
  }

  // ================ СВАЙП ================
  var SWIPE_SENS = 0.005;
  var targetYaw = 0, targetPitch = 0;
  var currentYaw = 0, currentPitch = 0;

  var isTouching = false;
  var lastTouchX = 0, lastTouchY = 0;
  var touchId = null;

  touchLayer.addEventListener('touchstart', function(e) {
    if (e.touches.length === 0) return;
    var t = e.touches[0];
    isTouching = true;
    touchId = t.identifier;
    lastTouchX = t.clientX;
    lastTouchY = t.clientY;
    e.preventDefault();
  }, { passive: false });

  touchLayer.addEventListener('touchmove', function(e) {
    if (!isTouching) return;
    for (var i = 0; i < e.touches.length; i++) {
      var t = e.touches[i];
      if (t.identifier === touchId) {
        var dx = t.clientX - lastTouchX;
        var dy = t.clientY - lastTouchY;
        lastTouchX = t.clientX;
        lastTouchY = t.clientY;
        targetYaw   -= dx * SWIPE_SENS;
        targetPitch -= dy * SWIPE_SENS;
        if (targetPitch >  Math.PI / 3) targetPitch =  Math.PI / 3;
        if (targetPitch < -Math.PI / 3) targetPitch = -Math.PI / 3;
        break;
      }
    }
    e.preventDefault();
  }, { passive: false });

  function endTouch(e) {
    isTouching = false;
    touchId = null;
    if (e) e.preventDefault();
  }
  touchLayer.addEventListener('touchend', endTouch, { passive: false });
  touchLayer.addEventListener('touchcancel', endTouch, { passive: false });

  // Мышь для десктопа
  var mouseDown = false;
  touchLayer.addEventListener('mousedown', function(e) {
    mouseDown = true;
    lastTouchX = e.clientX;
    lastTouchY = e.clientY;
  });
  touchLayer.addEventListener('mousemove', function(e) {
    if (!mouseDown) return;
    var dx = e.clientX - lastTouchX;
    var dy = e.clientY - lastTouchY;
    lastTouchX = e.clientX;
    lastTouchY = e.clientY;
    targetYaw   -= dx * SWIPE_SENS;
    targetPitch -= dy * SWIPE_SENS;
    if (targetPitch >  Math.PI / 3) targetPitch =  Math.PI / 3;
    if (targetPitch < -Math.PI / 3) targetPitch = -Math.PI / 3;
  });
  touchLayer.addEventListener('mouseup', function() { mouseDown = false; });
  touchLayer.addEventListener('mouseleave', function() { mouseDown = false; });

  // ================ FULLSCREEN ================
  // Определяем поддержку
  var fsSupported = !!(
    document.documentElement.requestFullscreen ||
    document.documentElement.webkitRequestFullscreen ||
    document.documentElement.mozRequestFullScreen ||
    document.documentElement.msRequestFullscreen
  );

  // iOS Safari НЕ поддерживает requestFullscreen для HTML
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var isStandalone = window.navigator.standalone === true ||
                     window.matchMedia('(display-mode: standalone)').matches;

  function goFullscreen() {
    var el = document.documentElement;

    if (isIOS) {
      // iOS не поддерживает — показываем подсказку
      if (isStandalone) {
        showToast('Уже в полноэкранном режиме ✓', 2000);
      } else {
        showToast('На iPhone: нажми «Поделиться» → «На экран "Домой"», затем открой с домашнего экрана для полного экрана', 6000);
      }
      return;
    }

    if (fsSupported) {
      var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
      if (!fsEl) {
        var p;
        if (el.requestFullscreen) p = el.requestFullscreen();
        else if (el.webkitRequestFullscreen) p = el.webkitRequestFullscreen();
        else if (el.mozRequestFullScreen) p = el.mozRequestFullScreen();
        else if (el.msRequestFullscreen) p = el.msRequestFullscreen();
        if (p && p.catch) p.catch(function(err) {
          console.log('Fullscreen error:', err);
          showToast('Не удалось войти в полный экран', 2000);
        });
        // Пробуем ландшафт
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(function(){});
        }
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }
    } else {
      showToast('Полный экран не поддерживается браузером', 2000);
    }
  }

  // Обработчик кнопки — и click и touchend для надёжности на мобильных
  var fsBtnPressed = false;
  function handleFsPress(e) {
    if (e) {
      e.stopPropagation();
      e.preventDefault();
    }
    if (fsBtnPressed) return;
    fsBtnPressed = true;
    setTimeout(function() { fsBtnPressed = false; }, 300);
    goFullscreen();
  }
  fsBtn.addEventListener('click', handleFsPress);
  fsBtn.addEventListener('touchend', handleFsPress, { passive: false });

  // Отслеживаем состояние fullscreen для иконки
  function updateFsIcon() {
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    fsBtn.textContent = fsEl ? '⛶' : '⛶';
    // Можно менять на другой символ: fsEl ? '⤡' : '⛶'
  }
  document.addEventListener('fullscreenchange', updateFsIcon);
  document.addEventListener('webkitfullscreenchange', updateFsIcon);

  // ================ MEDIAPIPE ================
  var handsReady = false;
  var handData = [];
  var handsInstance = null;
  var mpRunning = false;

  var videoEl = document.createElement('video');
  videoEl.setAttribute('playsinline', '');
  videoEl.muted = true;
  videoEl.style.display = 'none';
  document.body.appendChild(videoEl);

  function initHands() {
    if (handsInstance) return;
    if (typeof Hands === 'undefined') {
      mpStatus.textContent = '⚠️ MediaPipe не загрузился';
      return;
    }
    try {
      handsInstance = new Hands({
        locateFile: function(f) {
          return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + f;
        }
      });
      handsInstance.setOptions({
        maxNumHands: 2,
        modelComplexity: 0,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5,
        selfieMode: true           // ← передняя камера, MediaPipe сам зеркалит
      });
      handsInstance.onResults(function(results) {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length) {
          handData = results.multiHandLandmarks.map(function(lm) {
            var ids = [0, 5, 9, 13, 17];
            var x = 0, y = 0;
            for (var i = 0; i < ids.length; i++) { x += lm[ids[i]].x; y += lm[ids[i]].y; }
            return { x: x / ids.length, y: y / ids.length, landmarks: lm };
          });
        } else {
          handData = [];
        }
      });

      trackModelDownload();

      handsInstance.initialize().then(function() {
        handsReady = true;
        mpFill.style.width = '100%';
        mpPct.textContent = '100%';
        mpStatus.textContent = 'Готово ✓';
        setTimeout(function() { mpBar.classList.add('hidden'); }, 800);
        startMpLoop();
      }).catch(function(err) {
        console.error('MP init error', err);
        mpStatus.textContent = '⚠️ Ошибка загрузки';
      });
    } catch (e) { console.error(e); }
  }

  function trackModelDownload() {
    var urls = [
      'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands_solution_packed_assets_loader.js',
      'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands_solution_simd_wasm_bin.wasm',
      'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.binarypb'
    ];
    var loadedPerFile = [0, 0, 0];
    var sizePerFile = [50000, 5000000, 500000];

    function updateBar() {
      var total = 0, loaded = 0;
      for (var i = 0; i < urls.length; i++) {
        total += sizePerFile[i];
        loaded += Math.min(loadedPerFile[i], sizePerFile[i]);
      }
      var pct = Math.min(99, Math.round((loaded / total) * 100));
      mpFill.style.width = pct + '%';
      mpPct.textContent = pct + '%';
    }

    urls.forEach(function(url, idx) {
      fetch(url).then(function(response) {
        var size = parseInt(response.headers.get('content-length')) || sizePerFile[idx];
        sizePerFile[idx] = size;
        var reader = response.body.getReader();
        function read() {
          return reader.read().then(function(result) {
            if (result.done) return;
            loadedPerFile[idx] += result.value.length;
            updateBar();
            return read();
          });
        }
        return read();
      }).catch(function() {});
    });
  }

  function startMpLoop() {
    if (mpRunning) return;
    mpRunning = true;
    function loop() {
      if (!mpRunning) return;
      if (handsReady && videoEl.readyState >= 2) {
        handsInstance.send({ image: videoEl }).catch(function(){});
      }
      requestAnimationFrame(loop);
    }
    loop();
  }

  // ================ СКЕЛЕТ РУК ================
  // ВАЖНО: MediaPipe с selfieMode:true уже зеркалит координаты так,
  // что "правая рука" = правая сторона экрана.
  // Мы НЕ зеркалим дополнительно — рисуем как есть.
  var CONNECTIONS = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],
    [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],
    [0,17],[0,5]
  ];
  var HAND_COLORS = ['#00ffff', '#ff44aa'];

  function drawHands() {
    handCtx.clearRect(0, 0, canvasHand.width, canvasHand.height);
    if (!handData.length) return;
    var W = canvasHand.width, H = canvasHand.height;

    for (var hi = 0; hi < handData.length; hi++) {
      var lm = handData[hi].landmarks;
      var color = HAND_COLORS[hi % HAND_COLORS.length];

      // НЕ зеркалим — MediaPipe уже отдал правильные координаты
      function px(l) { return l.x * W; }
      function py(l) { return l.y * H; }

      handCtx.strokeStyle = color;
      handCtx.lineWidth = 4;
      handCtx.lineCap = 'round';
      handCtx.lineJoin = 'round';
      handCtx.shadowColor = color;
      handCtx.shadowBlur = 12;

      for (var ci = 0; ci < CONNECTIONS.length; ci++) {
        var a = lm[CONNECTIONS[ci][0]];
        var b = lm[CONNECTIONS[ci][1]];
        handCtx.beginPath();
        handCtx.moveTo(px(a), py(a));
        handCtx.lineTo(px(b), py(b));
        handCtx.stroke();
      }

      handCtx.shadowBlur = 8;
      handCtx.fillStyle = color;
      for (var ji = 0; ji < lm.length; ji++) {
        var j = lm[ji];
        handCtx.beginPath();
        handCtx.arc(px(j), py(j), 4, 0, Math.PI * 2);
        handCtx.fill();
      }

      handCtx.shadowBlur = 15;
      var tips = [4, 8, 12, 16, 20];
      for (var ti = 0; ti < tips.length; ti++) {
        var tp = lm[tips[ti]];
        handCtx.fillStyle = '#ffffff';
        handCtx.beginPath();
        handCtx.arc(px(tp), py(tp), 6, 0, Math.PI * 2);
        handCtx.fill();
        handCtx.strokeStyle = color;
        handCtx.lineWidth = 2;
        handCtx.stroke();
      }
      handCtx.shadowBlur = 0;
    }
  }

  // ================ ИГРА ================
  var running = false;
  var score = 0, combo = 1, comboTimer = 0;
  var spawnTimer = 0, spawnInterval = 1.2, gameSpeed = 4, elapsed = 0;

  function resetGame() {
    score = 0; combo = 1; comboTimer = 0;
    spawnTimer = 0; gameSpeed = 4; elapsed = 0;
    scoreEl.textContent = '0';
    comboEl.textContent = 'x1';
    for (var i = 0; i < cubes.length; i++) {
      cubes[i].visible = false;
      cubes[i].userData.active = false;
    }
    for (var j = 0; j < PARTICLE_COUNT; j++) pLife[j] = 0;
  }

  function spawnCube() {
    for (var i = 0; i < cubes.length; i++) {
      var cube = cubes[i];
      if (cube.userData.active) continue;
      cube.userData.active = true;
      cube.userData.speed = gameSpeed * (0.85 + Math.random() * 0.4);
      var color = CUBE_COLORS[Math.floor(Math.random() * CUBE_COLORS.length)];
      cube.material.color.setHex(color);
      cube.material.emissive.setHex(color);
      cube.userData.color = color;

      var angle = (Math.random() - 0.5) * Math.PI * 0.9;
      var radius = 3 + Math.random() * 2;
      cube.position.set(
        Math.sin(angle) * radius,
        1.5 + (Math.random() - 0.5) * 3,
        -20 - Math.random() * 10
      );
      cube.rotation.set(Math.random()*6, Math.random()*6, Math.random()*6);
      cube.userData.rotSpeed.set(
        (Math.random() - 0.5) * 1.5,
        (Math.random() - 0.5) * 1.5,
        (Math.random() - 0.5) * 1.5
      );
      cube.visible = true;
      return;
    }
  }

  var CATCH_DIST = 1.5;
  var CATCH_RADIUS = 0.55;

  function checkHits() {
    if (!handData.length) return;

    var handWorlds = handData.map(function(h) {
      // НЕ зеркалим — MediaPipe уже отдал правильные координаты
      var nx = h.x;
      var ny = h.y;
      var ndcX = nx * 2 - 1;
      var ndcY = -(ny * 2 - 1);
      var vec = new THREE.Vector3(ndcX, ndcY, 0.5).unproject(camera);
      var dir = vec.sub(camera.position).normalize();
      return camera.position.clone().add(dir.multiplyScalar(CATCH_DIST));
    });

    for (var i = 0; i < cubes.length; i++) {
      var cube = cubes[i];
      if (!cube.userData.active) continue;
      for (var j = 0; j < handWorlds.length; j++) {
        var d = cube.position.distanceTo(handWorlds[j]);
        if (d < CATCH_RADIUS) {
          cube.userData.active = false;
          cube.visible = false;
          score += 10 * combo;
          combo = Math.min(combo + 1, 8);
          comboTimer = 2.0;
          scoreEl.textContent = score;
          comboEl.textContent = 'x' + combo;
          spawnParticles(cube.position, cube.userData.color, 14);
          break;
        }
      }
    }
  }

  // ================ АНИМАЦИЯ ================
  var lastT = performance.now() / 1000;
  var handDrawAccum = 0;
  var HAND_DRAW_INTERVAL = 1/30;

  function animate() {
    requestAnimationFrame(animate);

    var now = performance.now() / 1000;
    var dt = now - lastT;
    lastT = now;
    if (dt > 0.1) dt = 0.1;
    if (dt < 0) dt = 0;

    currentYaw   += (targetYaw   - currentYaw)   * Math.min(1, dt * 12);
    currentPitch += (targetPitch - currentPitch) * Math.min(1, dt * 12);

    camera.rotation.y = currentYaw;
    camera.rotation.x = currentPitch;
    camera.rotation.z = 0;

    pano.position.copy(camera.position);

    if (running) {
      elapsed += dt;
      spawnTimer += dt;
      gameSpeed = 4 + elapsed * 0.15;

      if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        spawnCube();
      }

      for (var i = 0; i < cubes.length; i++) {
        var cube = cubes[i];
        if (!cube.userData.active) continue;
        var dir = camera.position.clone().sub(cube.position).normalize();
        cube.position.addScaledVector(dir, cube.userData.speed * dt);
        cube.rotation.x += cube.userData.rotSpeed.x * dt;
        cube.rotation.y += cube.userData.rotSpeed.y * dt;
        cube.rotation.z += cube.userData.rotSpeed.z * dt;

        if (cube.position.distanceTo(camera.position) < 0.5) {
          cube.userData.active = false;
          cube.visible = false;
          if (combo > 1) { combo = 1; comboEl.textContent = 'x1'; }
        }
      }

      if (comboTimer > 0) {
        comboTimer -= dt;
        if (comboTimer <= 0) { combo = 1; comboEl.textContent = 'x1'; }
      }

      checkHits();
    }

    var anyAlive = false;
    for (var j = 0; j < PARTICLE_COUNT; j++) {
      if (pLife[j] <= 0) continue;
      anyAlive = true;
      pLife[j] -= dt * 1.6;
      if (pLife[j] < 0) pLife[j] = 0;
      pPos[j*3]   += pVel[j*3]   * dt;
      pPos[j*3+1] += pVel[j*3+1] * dt;
      pPos[j*3+2] += pVel[j*3+2] * dt;
      pVel[j*3]   *= 0.94;
      pVel[j*3+1] *= 0.94;
      pVel[j*3+2] *= 0.94;
    }
    if (anyAlive) {
      particleGeo.attributes.position.needsUpdate = true;
      particles.material.opacity = 0.95;
    } else {
      particles.material.opacity = 0;
    }

    handDrawAccum += dt;
    if (handDrawAccum >= HAND_DRAW_INTERVAL) {
      handDrawAccum = 0;
      drawHands();
    }

    renderer.render(scene, camera);
  }

  // ================ РАЗМЕРЫ ================
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    canvasHand.width = w;
    canvasHand.height = h;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function() { setTimeout(resize, 200); });
  resize();

  // ================ СТАРТ ================
  startBtn.addEventListener('click', function() {
    startBtn.disabled = true;
    startBtn.textContent = 'Запуск...';
    statusEl.textContent = 'Запускаем камеру...';

    // Пробуем fullscreen
    goFullscreen();

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      startBtn.disabled = false;
      startBtn.textContent = '❌ Нет камеры';
      return;
    }

    navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: 'user',
        width: { ideal: 640 },
        height: { ideal: 480 }
      }
    }).then(function(stream) {
      videoEl.srcObject = stream;
      return videoEl.play();
    }).then(function() {
      startBtn.classList.add('hidden');
      resetGame();
      running = true;
      lastT = performance.now() / 1000;

      mpBar.classList.remove('hidden');
      mpStatus.textContent = 'Загрузка рук...';
      mpFill.style.width = '0%';
      mpPct.textContent = '0%';

      statusEl.textContent = 'Свайпни по экрану — поверни камеру. Лови кубы.';
      initHands();
    }).catch(function(err) {
      console.error(err);
      startBtn.disabled = false;
      startBtn.textContent = '❌ Повторить';
      statusEl.textContent = '❌ Камера: ' + (err.name || err.message || 'ошибка');
    });
  });

  // Показываем один раз подсказку про iOS fullscreen
  if (isIOS && !isStandalone) {
    setTimeout(function() {
      if (!running) {
        showToast('Совет: добавь на домашний экран для полного экрана', 4000);
      }
    }, 2000);
  }

  animate();

})();
</script>
